<style>
:root{--bg:#0b1421;--panel:#15263a;--panel2:#1b3246;--line:#35536a;--paper:#edf6fb;--muted:#b5c7d5;--aqua:#81e6d9;--gold:#f9d28c;--red:#ffa8a8;--green:#a8e5a9;--radius:12px}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:disabled{opacity:.38;cursor:default}#app{height:100dvh;min-height:355px;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(ellipse at 53% 48%,#183d45 0%,#101e30 49%,#0b1421 90%);padding:env(safe-area-inset-top) max(8px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(8px,env(safe-area-inset-left));gap:5px}
.header{flex:0 0 38px;display:flex;align-items:center;gap:9px;background:#101e30d9;border:1px solid #294355;border-radius:9px;padding:5px 10px}.brand{font-size:14px;font-weight:850;white-space:nowrap;letter-spacing:.02em}.brand small{font-size:9px;color:#a9c9d3;font-weight:600;margin-left:6px}.turnInfo{display:flex;align-items:center;gap:7px;margin-left:auto;min-width:0;font-size:11px}.turnChip{background:#264355;border-radius:20px;padding:5px 9px;white-space:nowrap;font-weight:700}.resource{font-variant-numeric:tabular-nums;color:var(--gold);white-space:nowrap;font-weight:750}.tinyBtn{background:#1c3247;border:1px solid #3b586c;border-radius:7px;padding:6px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.battle{display:grid;grid-template-rows:minmax(85px,1fr) 31px minmax(85px,1fr);flex:1;min-height:0;gap:3px}.lane{display:flex;gap:6px;min-height:0;align-items:center}.hero{flex:0 0 111px;max-width:111px;height:92%;min-height:70px;border:1px solid #436578;border-radius:10px;background:linear-gradient(160deg,#213b51,#152638);padding:5px 7px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:3px;position:relative;text-align:left}.hero.enemy{background:linear-gradient(160deg,#4b2c42,#211e31);border-color:#815667}.hero.targetable{box-shadow:0 0 0 2px #ffe39b,inset 0 0 0 1px #ffe39b}.heroName{font-size:12px;font-weight:800;letter-spacing:.01em}.heroLife{font-size:20px;font-weight:900;line-height:1;color:#ffe7e6}.heroLife span{font-size:10px;color:#edc4c3;font-weight:600}.heroMini{font-size:10px;color:#b8ccdb;white-space:nowrap}.field{display:flex;align-items:center;justify-content:center;gap:5px;min-width:0;flex:1;height:100%;padding:2px 0}.slot{width:clamp(51px,9.4vw,115px);height:100%;max-height:137px;min-height:75px;display:flex;align-items:center;justify-content:center;border-radius:9px;border:1px dashed #42617777;background:#18314733}.unit,.handCard{width:100%;height:100%;border-radius:8px;border:1px solid #7198a8;background:linear-gradient(150deg,#294c5d,#172a3b);padding:4px;display:flex;flex-direction:column;gap:2px;text-align:left;position:relative;overflow:hidden;box-shadow:0 2px 4px #02091280}.unit{width:100%}.unit.fresh{filter:saturate(.66)}.unit.ready{border-color:var(--aqua)}.unit.selected,.handCard.selected{border:2px solid #ffe39b;background:linear-gradient(155deg,#5e634e,#263640);box-shadow:0 0 8px #efdb9f80}.unit.targetable{border:2px solid #efb67c;box-shadow:0 0 7px #efb67c99}.unit.enemyUnit{background:linear-gradient(145deg,#493b52,#24273c);border-color:#957b9c}.unit.enemyUnit.targetable{border-color:#ffcc92}.idrow{display:flex;align-items:center;justify-content:space-between;gap:2px}.id{font-size:9px;font-weight:850;color:#f1f7f9}.cost{min-width:19px;height:19px;display:grid;place-items:center;border-radius:50%;background:#346b91;border:1px solid #8bb8db;color:#eefaff;font-size:12px;font-weight:850;line-height:1}.art{flex:1;min-height:0;display:grid;place-items:center;border-radius:5px;background:#91daca17;font-size:clamp(14px,2.8vw,28px)}.effect{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d6f7f1;font-weight:700}.effect.noAbility{color:#91a8b7}.stats{display:flex;align-items:center;justify-content:space-between;gap:2px;font-size:10px;font-weight:850}.statA{color:#ffcaa6}.statH{color:#bff6c5}.atkCount{font-size:8px;color:#ffe09b;position:absolute;bottom:20px;right:3px}.centerBar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#0a1925a9;border:1px solid #2d5464;border-radius:8px;padding:2px 10px;min-width:0}.centerLabel{font-size:11px;font-weight:750;color:#9fe7de;white-space:nowrap}.hint{font-size:10px;color:#dfecf5;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}.cancelBtn{font-size:10px;padding:3px 8px;border-radius:6px;border:1px solid #566778;background:#2a4050;white-space:nowrap}
.handBar{flex:0 0 119px;min-height:0;border:1px solid #37586b;border-radius:10px;background:#102235ea;display:flex;gap:8px;padding:6px 8px}.handArea{display:flex;flex-direction:column;min-width:0;flex:1;gap:3px}.handLabel{font-size:10px;font-weight:750;color:#bfdded;display:flex;gap:7px;align-items:center}.handList{display:flex;align-items:stretch;gap:5px;flex:1;overflow-x:auto;min-height:0;padding-bottom:1px;scrollbar-width:thin}.handCard{flex:0 0 clamp(74px,10.7vw,105px);height:100%;min-height:0}.handCard.spell{background:linear-gradient(145deg,#51432f,#282a32);border-color:#bdaa78}.handCard.unplayable{opacity:.58}.handCard .art{font-size:22px}.handCard .effect{font-size:9px;white-space:normal;line-height:1.1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.handCard .stats{font-size:9px}.rightTools{width:138px;flex:0 0 138px;display:flex;flex-direction:column;gap:4px;min-width:0}.endBtn{min-height:38px;background:linear-gradient(180deg,#d4e6a4,#a6ce80);color:#102a2d;font-weight:900;font-size:13px;border:0;border-radius:8px}.log{flex:1;min-height:0;overflow:auto;background:#0a1a2b;border-radius:6px;padding:4px 6px;font-size:9px;line-height:1.35;color:#c2d5e3}.log div{margin-bottom:3px}.log div:first-child{color:#ebf6fd}.footer{height:18px;flex:0 0 18px;color:#96afbe;display:flex;justify-content:space-between;align-items:center;font-size:10px;gap:6px}.footer span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.overlay{position:fixed;inset:0;display:none;place-items:center;background:#071019cb;z-index:10;padding:20px}.overlay.show{display:grid}.dialog{width:min(530px,95vw);max-height:86dvh;overflow:auto;background:#1d3546;border:1px solid #5a8790;border-radius:16px;padding:20px;box-shadow:0 12px 40px #0009}.dialog h2{margin:0 0 10px;font-size:21px}.dialog p,.dialog li{font-size:13px;line-height:1.7;color:#e2eff3}.dialog ul{padding-left:21px}.dialogAction{background:#93e2d4;color:#092932;border:0;border-radius:9px;font-weight:850;padding:11px 16px;margin-top:8px}.dialogSecondary{background:transparent;color:#dbedf5;border:1px solid #567582;border-radius:9px;padding:10px 13px;margin:8px 0 0 8px}.toast{position:fixed;left:50%;bottom:calc(133px + env(safe-area-inset-bottom));transform:translate(-50%,0);font-size:12px;font-weight:700;background:#30475a;color:#fff;border:1px solid #83a8b8;border-radius:10px;padding:8px 14px;z-index:9;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 5px 20px #000a;opacity:0;transition:opacity .2s}.toast.show{opacity:1}.portraitNote{display:none}
@media (max-height:410px){#app{gap:3px}.header{flex-basis:31px;padding:2px 8px}.handBar{flex-basis:102px;padding:4px 6px}.footer{height:12px;flex-basis:12px;font-size:9px}.battle{grid-template-rows:minmax(76px,1fr) 25px minmax(76px,1fr)}.art{font-size:16px}.handCard .art{font-size:17px}.rightTools{width:130px;flex-basis:130px}.endBtn{min-height:32px}.centerBar{padding:0 8px}.hero{min-height:66px}.handLabel{font-size:9px}.unit,.handCard{padding:3px}.effect{font-size:8px}}
@media (max-width:685px){.brand small{display:none}.hero{flex-basis:84px;max-width:84px;padding:4px}.heroName{font-size:10px}.heroLife{font-size:17px}.heroMini{font-size:9px}.rightTools{flex-basis:100px;width:100px}.endBtn{font-size:11px}.field{gap:3px}.slot{width:clamp(43px,11vw,74px)}.handCard{flex-basis:70px}.hint{font-size:9px}.brand{font-size:12px}}
@media(orientation:portrait) and (max-width:650px){.portraitNote{display:grid;place-items:center;position:fixed;inset:0;background:#0d1c2d;z-index:20;text-align:center;padding:25px}.portraitNote strong{font-size:23px}.portraitNote p{line-height:1.7;color:#bfd3de}}
</style>
</head>
<body>
<div class="portraitNote"><div><strong>📱 横向きにして遊ぼう</strong><p>このテスト版はiPhone・iPadの横画面向けです。<br>端末を横向きにすると対戦画面が表示されます。</p></div></div>
<main id="app">
  <header class="header"><div class="brand">⚔️ CARD DUEL <small>デッキB 対戦テスト v0.1</small></div><div class="turnInfo"><span id="turnChip" class="turnChip">準備中</span><span id="manaTop" class="resource">💠 0/0</span><button class="tinyBtn" id="rulesBtn">ルール</button><button class="tinyBtn" id="newBtn">やり直す</button></div></header>
  <section class="battle">
    <div class="lane"><button class="hero enemy" id="cpuHero" aria-label="CPUプレイヤー"><div class="heroName">🤖 CPU｜B</div><div class="heroLife" id="cpuLife">♥ 10 <span>/10</span></div><div class="heroMini" id="cpuInfo">山札30・手札0</div></button><div class="field" id="cpuField"></div></div>
    <div class="centerBar"><span class="centerLabel" id="phase">⚔️ バトル</span><span class="hint" id="hint">手札のカードをタップして行動</span><button class="cancelBtn" id="cancelBtn">選択解除</button></div>
    <div class="lane"><button class="hero" id="playerHero" aria-label="自分のプレイヤー"><div class="heroName">🙂 あなた｜B</div><div class="heroLife" id="playerLife">♥ 10 <span>/10</span></div><div class="heroMini" id="playerInfo">山札30・手札0</div></button><div class="field" id="playerField"></div></div>
  </section>
  <section class="handBar"><div class="handArea"><div class="handLabel"><span>🃏 手札 <b id="handCount">0/7</b></span><span id="manaHand" class="resource">マナ 0/0</span></div><div class="handList" id="hand"></div></div><aside class="rightTools"><button class="endBtn" id="endBtn">ターン終了 ▶</button><div class="log" id="log" aria-live="polite"></div></aside></section>
  <div class="footer"><span id="record">勝敗記録：0勝 / 0敗 / 0分</span><span>同じデッキ30枚で対戦｜オフライン対応</span></div>
</main>
<div class="toast" id="toast"></div>
<div class="overlay" id="modal"><section class="dialog"><h2 id="modalTitle"></h2><div id="modalContent"></div><button class="dialogAction" id="modalOk">閉じる</button><button class="dialogSecondary" id="modalAlt" style="display:none">もう一度対戦</button></section></div>
<script>
'use strict';
(() => {
const MONSTERS=[
['M-01',1,1,2,'',0],['M-02',1,1,1,'legacy',1],['M-03',2,2,3,'',0],['M-04',2,1,2,'draw',1],['M-05',2,1,1,'double',0],
['M-06',3,3,4,'',0],['M-07',3,2,3,'heal',1],['M-08',3,2,2,'blast',1],['M-09',4,4,5,'',0],['M-10',4,2,3,'double',0],
['M-11',4,3,3,'legacy',1],['M-12',5,5,6,'',0],['M-13',5,3,3,'draw',2],['M-14',5,3,4,'heal',2],['M-15',6,6,7,'',0],
['M-16',6,4,5,'blast',2],['M-17',7,5,6,'legacy',2],['M-18',8,4,9,'',0],['M-19',9,6,7,'blast',3],['M-20',10,8,8,'',0]];
const SPELLS=[['S-01',2,'dmg',2],['S-02',4,'dmg',4],['S-03',3,'aoe',1],['S-04',5,'aoe',2],['S-05',2,'draw',1],['S-06',4,'draw',2],['S-07',2,'heal',2],['S-08',2,'buff',2],['S-09',2,'debuff',2],['S-10',5,'dmgDraw',3]];
const CARDS={};for(const [id,cost,atk,hp,ability,n] of MONSTERS) CARDS[id]={id,type:'monster',cost,atk,hp,ability,n};
for(const [id,cost,ability,n] of SPELLS) CARDS[id]={id,type:'spell',cost,ability,n};
const DECK_B={'M-01':3,'M-02':2,'M-03':2,'M-04':2,'M-05':1,'M-06':2,'M-07':1,'M-08':1,'M-09':1,'M-10':1,'M-11':1,'M-12':1,'M-13':1,'M-15':1,'M-18':1,'S-01':2,'S-02':1,'S-03':1,'S-05':1,'S-07':1,'S-08':1,'S-09':1,'S-10':1};
const deckCount=Object.values(DECK_B).reduce((a,b)=>a+b,0);if(deckCount!==30||Object.values(DECK_B).some(n=>n>3)||Object.keys(DECK_B).some(id=>!CARDS[id])) throw Error('デッキB構築エラー');
const el=id=>document.getElementById(id);
const other=who=>who==='player'?'cpu':'player';
const abilityLabel=c=>{if(c.type==='spell'){switch(c.ability){case'dmg':return`敵1体 ${c.n}ダメ`;case'aoe':return`敵全体 ${c.n}ダメ`;case'draw':return`${c.n}枚ドロー`;case'heal':return`ライフ${c.n}回復`;case'buff':return`味方ATK +${c.n}`;case'debuff':return`敵ATK -${c.n}`;case'dmgDraw':return`敵1体3ダメ＋1ドロー`}}return({'':'能力なし',legacy:`遺志${c.n}`,draw:`ドロー${c.n}`,double:'連撃',heal:`治癒${c.n}`,blast:`爆炎${c.n}`})[c.ability]};
const art=c=>c.type==='spell'?({'dmg':'🔥','aoe':'💥','draw':'📖','heal':'💚','buff':'⚔️','debuff':'🌫️','dmgDraw':'✨'})[c.ability]:({'':'🛡️',legacy:'🕯️',draw:'📖',double:'⚔️',heal:'💚',blast:'🔥'})[c.ability];
let game=null,uid=0,toastTimer=0,cpuTimer=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newSide(){let cards=[];for(const [id,count] of Object.entries(DECK_B)) for(let i=0;i<count;i++) cards.push(id);return {life:10,deck:shuffle(cards),hand:[],field:[],turns:0,mana:0,maxMana:0}}
function log(msg){game.logs.unshift(msg);game.logs.length=Math.min(40,game.logs.length)}
function note(msg){clearTimeout(toastTimer);el('toast').textContent=msg;el('toast').classList.add('show');toastTimer=setTimeout(()=>el('toast').classList.remove('show'),2300)}
function draw(who,num){const s=game[who];let got=0;for(let i=0;i<num;i++){if(s.hand.length>=7||s.deck.length===0)break;s.hand.push(s.deck.pop());got++}if(got)log(`${who==='player'?'あなた':'CPU'}：${got}枚ドロー`);return got}
function recover(who,n){const s=game[who];let actual=Math.min(n,10-s.life);s.life+=actual;if(actual>0)log(`${who==='player'?'あなた':'CPU'}：ライフ＋${actual}`)}
function damageTargets(who,n,targetSid=null){const hits=game[who].field.filter(u=>targetSid==null||u.sid===targetSid);for(const u of hits)u.hp-=n;log(`${who==='player'?'あなた':'CPU'}側 ${hits.length}体に${n}ダメージ`);resolveDeaths()}
function resolveDeaths(){// 同時破壊を確定させてから遺志の効果を処理する
const deaths=[];for(const who of ['player','cpu']){const s=game[who];const alive=[];for(const u of s.field){if(u.hp<=0) deaths.push({who,u});else alive.push(u)}s.field=alive}for(const {who,u} of deaths)log(`${who==='player'?'あなた':'CPU'}の${u.id}が破壊`);for(const {who,u} of deaths){const c=CARDS[u.id];if(c.ability==='legacy')draw(who,c.n)}}
function winnerCheck(){if(game.over)return true;const pl=game.player.life,cl=game.cpu.life;if(pl<=0||cl<=0){finish(pl<=0&&cl<=0?'draw':cl<=0?'win':'lose');return true}
// どちらにも現存・未使用のモンスターがなくなれば、これ以上直接攻撃は不可能
const hasAnyMonster=who=>game[who].field.length>0||game[who].hand.some(id=>CARDS[id].type==='monster')||game[who].deck.some(id=>CARDS[id].type==='monster');
if(!hasAnyMonster('player')&&!hasAnyMonster('cpu')){finish('draw');return true}return false}
function attackReady(u,who){return game[who].turns>u.summonedTurn && u.attacksUsed<(CARDS[u.id].ability==='double'?2:1)}
function effectiveATK(u){return Math.max(0,CARDS[u.id].atk+u.mod)}
function startTurn(who){if(game.over)return;game.turn=who;const s=game[who];s.turns++;s.maxMana=Math.min(s.turns,10);s.mana=s.maxMana;for(const u of s.field)u.attacksUsed=0;game.selected=null;log(`── ${who==='player'?'あなた':'CPU'}の${s.turns}ターン目（マナ${s.mana}） ──`);draw(who,1);render();if(winnerCheck())return;if(who==='cpu')cpuTimer=setTimeout(cpuPlay,600)}
function endTurn(){if(game.over)return;for(const who of ['player','cpu'])for(const u of game[who].field){u.hp=CARDS[u.id].hp;u.mod=0}game.selected=null;startTurn(other(game.turn))}
function summon(who,index){const s=game[who],id=s.hand[index],c=CARDS[id];if(!c||c.type!=='monster'||s.mana<c.cost||s.field.length>=5)return false;s.hand.splice(index,1);s.mana-=c.cost;const u={id,sid:++uid,hp:c.hp,mod:0,attacksUsed:0,summonedTurn:s.turns};s.field.push(u);log(`${who==='player'?'あなた':'CPU'}が${id}を召喚`);switch(c.ability){case'draw':draw(who,c.n);break;case'heal':recover(who,c.n);break;case'blast':damageTargets(other(who),c.n);break}game.selected=null;winnerCheck();return true}
function cast(who,index,targetSid){const s=game[who],id=s.hand[index],c=CARDS[id];if(!c||c.type!=='spell'||s.mana<c.cost)return false;const foe=other(who);let t=null;
if(['dmg','dmgDraw','debuff'].includes(c.ability)){t=game[foe].field.find(u=>u.sid===targetSid);if(!t)return false}
if(c.ability==='buff'){t=s.field.find(u=>u.sid===targetSid);if(!t)return false}
s.hand.splice(index,1);s.mana-=c.cost;log(`${who==='player'?'あなた':'CPU'}が${id}を使用`);
switch(c.ability){case'dmg':damageTargets(foe,c.n,t.sid);break;case'aoe':damageTargets(foe,c.n);break;case'draw':draw(who,c.n);break;case'heal':recover(who,c.n);break;case'buff':t.mod+=c.n;break;case'debuff':t.mod-=c.n;break;case'dmgDraw':damageTargets(foe,c.n,t.sid);draw(who,1);break}game.selected=null;winnerCheck();return true}
function fight(who,sid,targetSid=null){const foe=other(who);const attacker=game[who].field.find(u=>u.sid===sid);if(!attacker||!attackReady(attacker,who))return false;if(game[foe].field.length){const target=game[foe].field.find(u=>u.sid===targetSid);if(!target)return false;attacker.attacksUsed++;const a=effectiveATK(attacker),b=effectiveATK(target);attacker.hp-=b;target.hp-=a;log(`${attacker.id} → ${target.id}（${a} / 反撃${b}）`);resolveDeaths()}else{attacker.attacksUsed++;game[foe].life=Math.max(0,game[foe].life-1);log(`${who==='player'?'あなた':'CPU'}が直接攻撃！ 相手ライフ－1`)}game.selected=null;winnerCheck();return true}
function selSpellTarget(c){return ['dmg','dmgDraw','debuff','buff'].includes(c.ability)}
function clickHand(index){if(game.turn!=='player'||game.over)return;const c=CARDS[game.player.hand[index]];if(!c)return;if(game.player.mana<c.cost){note('マナが足りないよ');return}if(c.type==='monster'){if(game.player.field.length>=5){note('フィールドは最大5体まで');return}summon('player',index);render();return}if(selSpellTarget(c)){if(c.ability==='buff'&&!game.player.field.length){note('強化する味方モンスターがいないよ');return}if(c.ability!=='buff'&&!game.cpu.field.length){note('対象の敵モンスターがいないよ');return}game.selected={kind:'spell',index};render();return}cast('player',index);render()}
function clickOwnUnit(sid){if(game.turn!=='player'||game.over)return;const sel=game.selected;if(sel?.kind==='spell'){const c=CARDS[game.player.hand[sel.index]];if(c?.ability==='buff'){cast('player',sel.index,sid);render()}else note('敵モンスターを選んでね');return}const u=game.player.field.find(x=>x.sid===sid);if(!u)return;if(!attackReady(u,'player')){note(game.player.turns<=u.summonedTurn?'召喚したターンは攻撃できないよ':'このモンスターは攻撃済み');return}game.selected={kind:'attack',sid};render()}
function clickEnemyUnit(sid){if(game.turn!=='player'||game.over)return;const sel=game.selected;if(sel?.kind==='attack')fight('player',sel.sid,sid);else if(sel?.kind==='spell'){const c=CARDS[game.player.hand[sel.index]];if(c?.ability!=='buff')cast('player',sel.index,sid);else note('味方モンスターを選んでね')}else{note('攻撃する味方、または魔法を選んでね')}render()}
function clickEnemyHero(){if(game.turn!=='player'||game.over)return;const sel=game.selected;if(sel?.kind!=='attack'){note('攻撃できる味方モンスターを選んでね');return}if(game.cpu.field.length){note('敵モンスターがいる間は直接攻撃できないよ');return}fight('player',sel.sid);render()}
function cpuCandidates(){const s=game.cpu,enemy=game.player,ready=s.field.filter(u=>attackReady(u,'cpu'));const a=[];for(let i=0;i<s.hand.length;i++){const c=CARDS[s.hand[i]];if(c.cost>s.mana)continue;if(c.type==='monster'){if(s.field.length>=5)continue;let score=4+c.cost*.50 + ((c.ability==='draw'&&s.hand.length<6)?c.n*1.5:0) + ((c.ability==='heal'&&s.life<=8)?c.n:0) + ((c.ability==='blast')?enemy.field.filter(u=>u.hp<=c.n).length*2:0);score+=Math.random()*.15;a.push({index:i,score});continue}
if(c.ability==='draw'){if(s.deck.length===0||s.hand.length>=7)continue;a.push({index:i,score:s.hand.length<=3?6.2:s.hand.length<=5?4.5:1.9});continue}
if(c.ability==='heal'){if(s.life>8)continue;a.push({index:i,score:s.life<=5?7:4});continue}
if(c.ability==='aoe'){if(!enemy.field.length)continue;const kills=enemy.field.filter(u=>u.hp<=c.n).length;if(!kills&&enemy.field.length<2)continue;a.push({index:i,score:3+kills*2.8+enemy.field.length*.38});continue}
if(c.ability==='dmg'||c.ability==='dmgDraw'){for(const t of enemy.field){const kills=t.hp<=c.n?1:0;let score=2+Math.min(c.n,t.hp)*.38+kills*2.9+(c.ability==='dmgDraw'&&s.hand.length<=6?1.7:0);if(!kills&&c.cost>=4&&enemy.field.length<2)score-=1;a.push({index:i,target:t.sid,score})}continue}
if(c.ability==='buff'&&ready.length&&enemy.field.length){const best=ready.some(u=>enemy.field.some(e=>e.hp<=effectiveATK(u)+c.n&&e.hp>effectiveATK(u)));if(best)a.push({index:i,target:ready[0].sid,score:5});continue}
if(c.ability==='debuff'&&ready.length&&enemy.field.length){const t=enemy.field.slice().sort((a,b)=>effectiveATK(b)-effectiveATK(a))[0];if(t&&effectiveATK(t)>0)a.push({index:i,target:t.sid,score:3.3});continue}
}return a.sort((a,b)=>b.score-a.score)}
function cpuPlay(){if(game.over||game.turn!=='cpu')return;let n=0;while(n++<24&&!game.over){const candidates=cpuCandidates();if(!candidates.length)break;const action=candidates[0];if(CARDS[game.cpu.hand[action.index]].type==='monster')summon('cpu',action.index);else cast('cpu',action.index,action.target)}
let safety=0;while(safety++<15&&!game.over){const ready=game.cpu.field.filter(u=>attackReady(u,'cpu'));if(!ready.length)break;let attacker=ready[0],target=null;if(game.player.field.length){let best=-Infinity;for(const u of ready)for(const t of game.player.field){const a=effectiveATK(u),b=effectiveATK(t);const kill=t.hp<=a;const survives=u.hp>b;const score=(kill?9:0)+(survives?4:0)+Math.min(t.hp,a)*.45-(u.hp<=b?2.5:0)+(t.hp<=a&&u.hp>b?2:0);if(score>best){best=score;attacker=u;target=t.sid}}}fight('cpu',attacker.sid,target)}render();if(!game.over)cpuTimer=setTimeout(()=>endTurn(),480)}
function cardHTML(c,u,side){const isHand=!u;const idx=u?.sid;const chosen=isHand?game.selected?.kind==='spell'&&game.selected.index===side:game.selected?.kind==='attack'&&game.selected.sid===idx;const targetable=!isHand&&game.turn==='player'&&(side==='cpu'&&((game.selected?.kind==='attack')||(game.selected?.kind==='spell'&&CARDS[game.player.hand[game.selected.index]]?.ability!=='buff'))||side==='player'&&game.selected?.kind==='spell'&&CARDS[game.player.hand[game.selected.index]]?.ability==='buff');const ready=!isHand&&side==='player'&&game.turn==='player'&&attackReady(u,'player');const classes=[isHand?'handCard':'unit',isHand&&c.type==='spell'?'spell':'',!isHand&&side==='cpu'?'enemyUnit':'',!isHand&&!attackReady(u,side)?'fresh':'',ready?'ready':'',chosen?'selected':'',targetable?'targetable':'',isHand&&game.player.mana<c.cost?'unplayable':''].filter(Boolean).join(' ');
return `<div class="${classes}" role="button" tabindex="0" aria-label="${c.id} ${abilityLabel(c)}"><div class="idrow"><span class="id">${c.id}</span><span class="cost">${c.cost}</span></div><div class="art">${art(c)}</div><div class="effect ${c.ability?'':'noAbility'}">${abilityLabel(c)}</div>${c.type==='monster'?`<div class="stats"><span class="statA">⚔ ${isHand?c.atk:effectiveATK(u)}</span><span class="statH">♥ ${isHand?c.hp:u.hp}/${c.hp}</span></div>`:`<div class="stats"><span style="color:#ffdaa1">魔法 ✦</span></div>`}${!isHand&&u.attacksUsed?`<span class="atkCount">${u.attacksUsed}/${c.ability==='double'?2:1}回</span>`:''}</div>`}
function makeSlots(who){const frag=document.createDocumentFragment();const units=game[who].field;for(let i=0;i<5;i++){const slot=document.createElement('div');slot.className='slot';if(units[i]){const u=units[i],c=CARDS[u.id];slot.innerHTML=cardHTML(c,u,who);slot.querySelector('.unit').addEventListener('click',()=>who==='player'?clickOwnUnit(u.sid):clickEnemyUnit(u.sid));slot.querySelector('.unit').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();who==='player'?clickOwnUnit(u.sid):clickEnemyUnit(u.sid)}})}frag.append(slot)}return frag}
function render(){if(!game)return;el('turnChip').textContent=game.over?'対戦終了':game.turn==='player'?'🟢 あなたのターン':'🟣 CPUのターン';el('manaTop').textContent=`💠 ${game.player.mana}/${game.player.maxMana}`;el('manaHand').textContent=`マナ ${game.player.mana}/${game.player.maxMana}`;el('cpuLife').innerHTML=`♥ ${game.cpu.life} <span>/10</span>`;el('playerLife').innerHTML=`♥ ${game.player.life} <span>/10</span>`;el('cpuInfo').textContent=`山札${game.cpu.deck.length}・手札${game.cpu.hand.length}`;el('playerInfo').textContent=`山札${game.player.deck.length}・手札${game.player.hand.length}`;el('handCount').textContent=`${game.player.hand.length}/7`;el('phase').textContent=game.turn==='player'?'🙂 あなたの番':'🤖 CPUの番';el('endBtn').disabled=game.turn!=='player'||game.over;el('cancelBtn').disabled=!game.selected;el('cpuHero').classList.toggle('targetable',game.turn==='player'&&game.selected?.kind==='attack'&&game.cpu.field.length===0);el('cpuField').replaceChildren(makeSlots('cpu'));el('playerField').replaceChildren(makeSlots('player'));
let hint='手札をタップして召喚・魔法使用。味方をタップして攻撃';if(game.over)hint='対戦終了。「やり直す」で再戦！';else if(game.turn==='cpu')hint='CPUが考え中…';else if(game.selected?.kind==='attack')hint=game.cpu.field.length?'攻撃する敵モンスターをタップ':'CPUのライフ欄をタップして直接攻撃';else if(game.selected?.kind==='spell'){const c=CARDS[game.player.hand[game.selected.index]];hint=c?.ability==='buff'?'強化する味方モンスターをタップ':'魔法の対象となる敵モンスターをタップ'}el('hint').textContent=hint;
const hf=document.createDocumentFragment();game.player.hand.forEach((id,i)=>{const c=CARDS[id],node=document.createElement('div');node.innerHTML=cardHTML(c,null,i);const card=node.firstChild;card.addEventListener('click',()=>clickHand(i));card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();clickHand(i)}});hf.append(card)});el('hand').replaceChildren(hf);el('log').innerHTML=game.logs.slice(0,6).map(s=>`<div>${escapeHTML(s)}</div>`).join('');updateRecord()}
function escapeHTML(t){return t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadRecord(){try{return JSON.parse(localStorage.getItem('bvb_record_v1'))||{win:0,lose:0,draw:0}}catch{return {win:0,lose:0,draw:0}}}
function updateRecord(){const r=loadRecord();el('record').textContent=`勝敗記録：${r.win||0}勝 / ${r.lose||0}敗 / ${r.draw||0}分`}
function finish(result){game.over=true;game.result=result;clearTimeout(cpuTimer);const r=loadRecord();r[result]=(r[result]||0)+1;try{localStorage.setItem('bvb_record_v1',JSON.stringify(r))}catch{}const title=result==='win'?'🎉 勝利！':result==='lose'?'💫 敗北！':'🤝 引き分け';log(title);render();showModal(title,`<p>あなた ${game.player.life} ライフ ／ CPU ${game.cpu.life} ライフ</p><p>同じデッキBで再戦して、先攻後攻や引き運による展開の違いを試してみよう。</p>`,true)}
function showModal(title,content,rematch=false){el('modalTitle').textContent=title;el('modalContent').innerHTML=content;el('modalAlt').style.display=rematch?'inline-block':'none';el('modal').classList.add('show')}
function hideModal(){el('modal').classList.remove('show')}
function newGame(){clearTimeout(cpuTimer);uid=0;game={player:newSide(),cpu:newSide(),turn:null,selected:null,over:false,result:null,logs:[]};draw('player',5);draw('cpu',5);log('デッキB vs デッキB 対戦開始！');hideModal();startTurn(Math.random()<.5?'player':'cpu')}
el('endBtn').addEventListener('click',()=>{if(game.turn==='player'&&!game.over)endTurn()});el('cpuHero').addEventListener('click',clickEnemyHero);el('cancelBtn').addEventListener('click',()=>{game.selected=null;render()});el('rulesBtn').addEventListener('click',()=>showModal('📘 テスト版ルール',`<ul><li>デッキB同士・各30枚、初期ライフ10、初期手札5枚。</li><li>先攻・後攻はランダム。各自のターン開始時に1枚引き、マナは1→10へ増えて全回復。</li><li>手札は最大7枚、場のモンスターは最大5体。召喚したターンは攻撃できません。</li><li>味方モンスターを選択して敵モンスターをタップすると戦闘。双方同時にATK分のダメージを受けます。</li><li>敵モンスターが0体なら、CPUのライフ欄をタップして直接攻撃できます。直接攻撃はATKにかかわらず1ダメージ。</li><li>連撃は1ターンに2回攻撃。ターン終了時に生存モンスターのHPと一時的なATK変化を戻します。</li><li>魔法は自分のターンに使用し、使用後捨て札。ライフが0なら敗北。山札が切れても敗北しません。</li><li>両者がモンスターを使い尽くした場合は引き分け。細かな膠着状態の判定は今後調整します。</li></ul>`));el('modalOk').addEventListener('click',hideModal);el('modalAlt').addEventListener('click',newGame);el('newBtn').addEventListener('click',()=>showModal('🔄 対戦をやり直す？','<p>現在の試合は終了して、新しい対戦が始まります。</p><p>次の試合もプレイヤーとCPUは同じデッキBを使用します。</p>',true));
// モバイルでのダブルタップ拡大を避ける
window.addEventListener('contextmenu',e=>e.preventDefault());
newGame();
// 自動検証用。ゲーム本体の動作には必要ありません。
window.__BVB_TEST__={getState:()=>JSON.parse(JSON.stringify(game)),cards:CARDS,deck:DECK_B,newGame,draw,startTurn,endTurn,summon,cast,fight,attackReady,resolveDeaths};
})();
</script>
