.battle{flex:1;min-height:0;display:grid;grid-template-rows:minmax(86px,1fr) 29px minmax(86px,1fr);gap:3px}.lane{min-height:0;display:flex;gap:7px;align-items:stretch}.hero{flex:0 0 112px;max-width:112px;min-height:0;border:1px solid #3e6a7c;border-radius:10px;background:linear-gradient(155deg,#22445a,#162a3b);padding:7px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:4px;text-align:left}.hero.enemy{border-color:#7f5873;background:linear-gradient(145deg,#4b2c44,#241d33)}.hero.targetable{border:2px solid #ffe39c;box-shadow:0 0 8px #ffe39c70}.heroName{font-size:12px;font-weight:850;white-space:nowrap}.heroLife{font-size:21px;line-height:1;font-weight:900;color:#ffe7e4}.heroLife span{font-size:10px;color:#ebc9cc;font-weight:650}.heroMini{font-size:10px;color:var(--muted);white-space:nowrap}
.formations{min-width:0;flex:1;display:grid;grid-template-rows:1fr 1fr;gap:4px}.zone{display:flex;align-items:center;gap:6px;min-height:0;min-width:0;border:1px solid #31576c88;border-radius:8px;padding:2px 6px;background:#0c24352e}.zone.front{border-color:#5990b5ba;background:#2b5c7240}.zoneLabel{flex:0 0 58px;font-size:10px;line-height:1.25;font-weight:800;color:#bcd5df;text-align:center}.zone.front .zoneLabel{color:#a5d8ff}.zoneLabel b{display:block;font-size:9px;font-weight:650;margin-top:2px;color:#98afc3}.slots{flex:1;min-width:0;display:flex;justify-content:center;align-items:stretch;gap:6px;height:100%}.slot{flex:0 1 110px;max-width:110px;min-width:0;border:1px dashed #42617799;border-radius:7px;background:#15283b45;display:flex;align-items:stretch;justify-content:center}.front .slot{flex:0 1 120px;border-color:#7b9fb366}
.unit,.handCard{width:100%;height:100%;min-width:0;border-radius:7px;border:1px solid #7aa2b3;background:linear-gradient(140deg,#295166,#193043);padding:4px;display:flex;flex-direction:column;gap:2px;position:relative;text-align:left;overflow:hidden;box-shadow:0 2px 5px #02091260;user-select:none}.unit.enemyUnit{border-color:#9a7b9c;background:linear-gradient(145deg,#51384d,#302a45)}.unit.blocker{border-color:#88bded;background:linear-gradient(155deg,#28587c,#15354d)}.unit.enemyUnit.blocker{border-color:#e5afc8;background:linear-gradient(155deg,#714359,#42283f)}.unit.fresh{filter:saturate(.67)}.unit.ready{box-shadow:inset 0 0 0 1px #99e5d7}.unit.selected,.handCard.selected{border:2px solid #ffe39b;background:linear-gradient(155deg,#535844,#2b3e4c);box-shadow:0 0 7px #ffe39b85}.unit.targetable{border:2px solid #ffcf99;box-shadow:0 0 9px #ffcc9470}.idrow{display:flex;align-items:center;justify-content:space-between;gap:2px}.id{font-size:10px;font-weight:850}.cost{min-width:19px;height:19px;display:grid;place-items:center;border:1px solid #8fc2e5;border-radius:50%;background:#2e6990;font-weight:900;font-size:11px;line-height:1}.art{flex:1;min-height:0;display:grid;place-items:center;border-radius:5px;background:#91daca13;font-size:clamp(12px,2.3vw,26px)}.effect{font-weight:700;font-size:9px;color:#d9f7ed;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.effect.noAbility{color:#a3bbc9}.stats{display:flex;justify-content:space-between;align-items:center;gap:2px;font-weight:850;font-size:10px;white-space:nowrap}.statA{color:#ffd0aa}.statH{color:#c5f8cd}.atkCount{position:absolute;bottom:19px;right:2px;font-size:8px;color:#ffda89}.marker{font-size:9px;color:#b8e0ff;font-weight:850}.handCard{flex:0 0 clamp(73px,10vw,112px);min-height:0}.handCard.spell{background:linear-gradient(155deg,#58452e,#2c2c35);border-color:#bba673}.handCard.unplayable{opacity:.52}.handCard .effect{white-space:normal;line-height:1.14;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.handCard .art{font-size:20px}.handCard .stats{font-size:9px}
.centerBar{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#091824da;border:1px solid #306070;border-radius:7px;padding:2px 8px;min-width:0}.centerLabel{font-weight:850;font-size:10px;color:#a1e4de;white-space:nowrap}.hint{flex:1;min-width:0;font-size:10px;color:#e0edf4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}.cancelBtn{font-size:10px;font-weight:750;padding:3px 6px;border-radius:5px;border:1px solid #546c7b;background:#294354;white-space:nowrap}
.handBar{flex:0 0 120px;min-height:0;display:flex;gap:8px;padding:6px 8px;background:#102338f0;border:1px solid #385a6e;border-radius:9px}.handArea{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.handLabel{font-size:10px;color:#bfd9e6;font-weight:800;display:flex;align-items:center;gap:12px}.handList{display:flex;gap:5px;overflow-x:auto;scrollbar-width:thin;flex:1;min-height:0;align-items:stretch;padding-bottom:1px}.rightTools{flex:0 0 140px;width:140px;min-width:0;display:flex;flex-direction:column;gap:4px}.endBtn{min-height:38px;background:linear-gradient(180deg,#d4e7a6,#a8d17f);border:0;border-radius:8px;color:#102830;font-weight:900;font-size:13px}.log{flex:1;overflow-y:auto;min-height:0;background:#09192a;border-radius:6px;padding:5px;font-size:9px;line-height:1.35;color:#c7d8e5}.log div{margin-bottom:2px}.log div:first-child{color:#effbff}.footer{flex:0 0 17px;display:flex;justify-content:space-between;gap:6px;align-items:center;color:#a1b8c4;font-size:9px}.footer span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.overlay{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:#050d17d8;padding:17px}.overlay.show{display:grid}.dialog{width:min(560px,94vw);max-height:86dvh;overflow:auto;border:1px solid #5a8596;border-radius:15px;padding:18px;background:#1c3548;box-shadow:0 15px 50px #000c}.dialog h2{margin:0 0 8px;font-size:19px}.dialog p,.dialog li{font-size:13px;line-height:1.65;color:#e0eef6}.dialog ul{padding-left:22px}.dialogAction{background:#93e4d3;color:#102930;border:0;border-radius:9px;font-weight:850;padding:9px 14px;margin-top:8px}.dialogSecondary{background:transparent;border:1px solid #678594;border-radius:9px;padding:9px 12px;margin:8px 0 0 8px}.toast{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;pointer-events:none;opacity:0;transition:opacity .17s;max-width:90vw;min-width:100px;text-align:center;background:#304a60;border:1px solid #83adbf;border-radius:9px;box-shadow:0 4px 16px #000a;padding:8px 13px;font-size:12px;font-weight:750}.toast.show{opacity:1}.portraitNote{display:none}
@media(max-height:570px){#app{gap:3px}.header{flex-basis:31px;padding:2px 6px}.battle{grid-template-rows:minmax(78px,1fr) 25px minmax(78px,1fr)}.lane{gap:4px}.hero{flex:0 0 87px;max-width:87px;padding:4px 5px;gap:2px}.heroName{font-size:10px}.heroLife{font-size:17px}.heroMini{font-size:9px}.formations{gap:2px}.zone{padding:1px 4px;gap:4px}.zoneLabel{flex-basis:44px;font-size:9px}.zoneLabel b{display:none}.slots{gap:4px}.slot{flex:0 1 96px;max-width:96px}.front .slot{flex:0 1 105px}.unit{padding:2px 4px;gap:0;justify-content:space-between}.unit .art{display:none}.unit .effect{font-size:8px}.unit .stats{font-size:9px}.unit .cost{min-width:15px;height:15px;font-size:9px}.unit .id{font-size:9px}.unit .atkCount{font-size:7px;bottom:11px}.handBar{flex-basis:104px;padding:4px 6px}.handCard{flex-basis:clamp(67px,9vw,94px);padding:3px}.handCard .art{font-size:16px}.handCard .cost{min-width:17px;height:17px;font-size:10px}.handCard .id{font-size:9px}.handCard .effect{font-size:8px}.rightTools{flex-basis:114px;width:114px}.endBtn{min-height:32px;font-size:11px}.footer{flex-basis:13px;font-size:8px}.centerBar{padding:0 6px}.centerLabel,.hint{font-size:9px}.handLabel{font-size:9px}}
@media(max-width:710px){.brand small{display:none}.brand{font-size:12px}.turnInfo{gap:4px}.tinyBtn{font-size:10px;padding:5px}.slot{max-width:85px}.hero{flex-basis:76px;max-width:76px}.zoneLabel{flex-basis:32px}.rightTools{width:96px;flex-basis:96px}.handCard{flex-basis:68px}.hint{font-size:8px}}
@media(orientation:portrait) and (max-width:650px){.portraitNote{display:grid;position:fixed;inset:0;place-items:center;z-index:20;text-align:center;padding:26px;background:#0c1b2b}.portraitNote strong{font-size:22px}.portraitNote p{line-height:1.7;color:#bfd3e3}}
</style>

<body>
<div class="portraitNote"><div><strong>📱 横向きにして遊ぼう</strong><p>このテスト版はiPhone・iPadの横画面向けです。<br>端末を横向きにすると対戦画面が表示されます。</p></div></div>
<main id="app">
 <header class="header"><div class="brand">⚔️ CARD DUEL <small>デッキB テスト v0.2</small></div><div class="turnInfo"><span id="turnChip" class="turnChip">準備中</span><span id="manaTop" class="resource">💠 0/0</span><button class="tinyBtn" id="rulesBtn">ルール</button><button class="tinyBtn" id="newBtn">やり直す</button></div></header>
 <section class="battle">
  <div class="lane"><button class="hero enemy" id="cpuHero" aria-label="CPUプレイヤーを攻撃"><div class="heroName">🤖 CPU｜B</div><div class="heroLife" id="cpuLife">♥ 10 <span>/10</span></div><div class="heroMini" id="cpuInfo">山札30・手札0</div></button><div class="formations"><div class="zone rear"><div class="zoneLabel">後列<b>攻撃役 ×3</b></div><div class="slots" id="cpuRear"></div></div><div class="zone front"><div class="zoneLabel">🛡 前列<b>壁役 ×1</b></div><div class="slots" id="cpuFront"></div></div></div></div>
  <div class="centerBar"><span class="centerLabel" id="phase">⚔️ バトル</span><span class="hint" id="hint">手札から召喚・魔法、味方をタップして攻撃</span><button class="cancelBtn" id="cancelBtn">選択解除</button></div>
  <div class="lane"><button class="hero" id="playerHero" aria-label="自分のプレイヤー"><div class="heroName">🙂 あなた｜B</div><div class="heroLife" id="playerLife">♥ 10 <span>/10</span></div><div class="heroMini" id="playerInfo">山札30・手札0</div></button><div class="formations"><div class="zone front"><div class="zoneLabel">🛡 前列<b>壁役 ×1</b></div><div class="slots" id="playerFront"></div></div><div class="zone rear"><div class="zoneLabel">後列<b>攻撃役 ×3</b></div><div class="slots" id="playerRear"></div></div></div></div>
 </section>
 <section class="handBar"><div class="handArea"><div class="handLabel"><span>🃏 手札 <b id="handCount">0/7</b></span><span class="resource" id="manaHand">マナ 0/0</span></div><div class="handList" id="hand"></div></div><aside class="rightTools"><button class="endBtn" id="endBtn">ターン終了 ▶</button><div class="log" id="log" aria-live="polite"></div></aside></section>
 <div class="footer"><span id="record">勝敗記録：0勝 / 0敗 / 0分</span><span>前列1・後列3｜HP引継ぎ｜オフライン対応</span></div>
</main>
<div class="toast" id="toast"></div>
<div class="overlay" id="modal"><section class="dialog"><h2 id="modalTitle"></h2><div id="modalContent"></div><button class="dialogAction" id="modalOk">閉じる</button><button class="dialogSecondary" id="modalAlt" style="display:none">もう一度対戦</button></section></div>
<script>
'use strict';
(() => {
  const MONSTERS = [
    ['M-01',1,1,2,'',0],['M-02',1,1,1,'legacy',1],['M-03',2,2,3,'',0],['M-04',2,1,2,'draw',1],['M-05',2,1,1,'double',0],
    ['M-06',3,3,4,'',0],['M-07',3,2,3,'heal',1],['M-08',3,2,2,'blast',1],['M-09',4,4,5,'',0],['M-10',4,2,3,'double',0],
    ['M-11',4,3,3,'legacy',1],['M-12',5,5,6,'',0],['M-13',5,3,3,'draw',2],['M-14',5,3,4,'heal',2],['M-15',6,6,7,'',0],
    ['M-16',6,4,5,'blast',2],['M-17',7,5,6,'legacy',2],['M-18',8,4,9,'',0],['M-19',9,6,7,'blast',3],['M-20',10,8,8,'',0]
  ];
  const SPELLS = [['S-01',2,'dmg',2],['S-02',4,'dmg',4],['S-03',3,'aoe',1],['S-04',5,'aoe',2],['S-05',2,'draw',1],['S-06',4,'draw',2],['S-07',2,'heal',2],['S-08',2,'buff',2],['S-09',2,'debuff',2],['S-10',5,'dmgDraw',3]];
  const CARDS = {};
  // 将来の拡張: traits に blockerDirect（ブロッカーでもプレイヤー攻撃可）、
  // reachRear（ブロッカーがいても後列モンスターを攻撃可）、
  // pierceFront（後列とプレイヤー双方へ攻撃可）を追加できる構造。
  for (const [id,cost,atk,hp,ability,n] of MONSTERS) CARDS[id] = {id,type:'monster',cost,atk,hp,ability,n,traits:['M-01','M-03'].includes(id)?['blocker']:[]};
  for (const [id,cost,ability,n] of SPELLS) CARDS[id] = {id,type:'spell',cost,ability,n,traits:[]};
  const DECK_B = {'M-01':3,'M-02':2,'M-03':2,'M-04':2,'M-05':1,'M-06':2,'M-07':1,'M-08':1,'M-09':1,'M-10':1,'M-11':1,'M-12':1,'M-13':1,'M-15':1,'M-18':1,'S-01':2,'S-02':1,'S-03':1,'S-05':1,'S-07':1,'S-08':1,'S-09':1,'S-10':1};
  if(Object.values(DECK_B).reduce((a,n)=>a+n,0)!==30 || Object.values(DECK_B).some(n=>n>3) || Object.keys(DECK_B).some(id=>!CARDS[id])) throw Error('デッキB構築エラー');
  const MAX_FRONT=1,MAX_REAR=3,MAX_HAND=7,MAX_LIFE=10;
  const el=id=>document.getElementById(id);
  const other=who=>who==='player'?'cpu':'player';
  const traits=id=>CARDS[id].traits||[];
  const hasTrait=(id,trait)=>traits(id).includes(trait);
  const isBlocker=u=>hasTrait(u.id,'blocker');
  const laneOf=c=>hasTrait(c.id,'blocker')?'front':'rear';
  const canAttackHero=u=>!isBlocker(u)||hasTrait(u.id,'blockerDirect');
  const bypassFront=u=>hasTrait(u.id,'pierceFront');
  const reachRear=u=>hasTrait(u.id,'reachRear')||bypassFront(u);
  const maxAttacks=u=>CARDS[u.id].ability==='double'?2:1;
  const art=c=>c.type==='spell'?({dmg:'🔥',aoe:'💥',draw:'📖',heal:'💚',buff:'⚔️',debuff:'🌫️',dmgDraw:'✨'})[c.ability]:(hasTrait(c.id,'blocker')?'🛡️':({'':'⚔️',legacy:'🕯️',draw:'📖',double:'⚔️',heal:'💚',blast:'🔥'})[c.ability]);
  function abilityLabel(c){if(c.type==='spell')return ({dmg:`敵1体 ${c.n}ダメ`,aoe:`敵全体 ${c.n}ダメ`,draw:`${c.n}枚ドロー`,heal:`ライフ${c.n}回復`,buff:`味方ATK＋${c.n}`,debuff:`敵ATK－${c.n}`,dmgDraw:'敵1体3ダメ＋1ドロー'})[c.ability];if(hasTrait(c.id,'blocker'))return 'ブロッカー';return ({'':'能力なし',legacy:`遺志${c.n}`,draw:`ドロー${c.n}`,double:'連撃',heal:`治癒${c.n}`,blast:`爆炎${c.n}`})[c.ability]}
  let game=null,uid=0,cpuTimer=0,toastTimer=0;
  function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function newSide(){const deck=[];for(const [id,n] of Object.entries(DECK_B))for(let i=0;i<n;i++)deck.push(id);return {life:MAX_LIFE,deck:shuffle(deck),hand:[],field:[],turns:0,mana:0,maxMana:0}}
  function log(msg){game.logs.unshift(msg);if(game.logs.length>60)game.logs.length=60}
  function note(msg){clearTimeout(toastTimer);el('toast').textContent=msg;el('toast').classList.add('show');toastTimer=setTimeout(()=>el('toast').classList.remove('show'),2200)}
  function draw(who,n){const s=game[who];let got=0;while(got<n && s.hand.length<MAX_HAND && s.deck.length){s.hand.push(s.deck.pop());got++}if(got)log(`${who==='player'?'あなた':'CPU'}：${got}枚ドロー`);return got}
  function recover(who,n){const s=game[who],actual=Math.min(n,MAX_LIFE-s.life);s.life+=actual;if(actual)log(`${who==='player'?'あなた':'CPU'}：ライフ＋${actual}`)}
  function resolveDeaths(){const deaths=[];for(const who of ['player','cpu']){const keep=[];for(const u of game[who].field){if(u.hp<=0)deaths.push({who,u});else keep.push(u)}game[who].field=keep}for(const {who,u} of deaths)log(`${who==='player'?'あなた':'CPU'}の${u.id}が破壊`);for(const {who,u} of deaths){const c=CARDS[u.id];if(c.ability==='legacy')draw(who,c.n)}}
  function damageTargets(who,n,sid=null){let hits=game[who].field.filter(u=>sid===null||u.sid===sid);for(const u of hits)u.hp-=n;log(`${who==='player'?'あなた':'CPU'}側 ${hits.length}体に${n}ダメージ`);resolveDeaths()}
  function potentialFinisher(who){const s=game[who];return s.field.some(u=>canAttackHero(u))||s.hand.some(id=>CARDS[id].type==='monster'&&(!hasTrait(id,'blocker')||hasTrait(id,'blockerDirect')))||s.deck.some(id=>CARDS[id].type==='monster'&&(!hasTrait(id,'blocker')||hasTrait(id,'blockerDirect')))}
  function winnerCheck(){if(game.over)return true;const pl=game.player.life,cl=game.cpu.life;if(pl<=0||cl<=0){finish(pl<=0&&cl<=0?'draw':cl<=0?'win':'lose');return true}if(!potentialFinisher('player')&&!potentialFinisher('cpu')){finish('draw');return true}return false}
  function countLane(who,lane){return game[who].field.filter(u=>laneOf(CARDS[u.id])===lane).length}
  function canSummon(who,id){const c=CARDS[id];if(!c||c.type!=='monster')return false;const lane=laneOf(c);return countLane(who,lane)<(lane==='front'?MAX_FRONT:MAX_REAR)}
  function attackReady(u,who){return game[who].turns>u.summonedTurn && u.attacksUsed<maxAttacks(u)}
  function effectiveATK(u){return Math.max(0,CARDS[u.id].atk+u.mod)}
  function legalUnitTargets(who,attacker){const enemy=game[other(who)].field,front=enemy.filter(isBlocker);return front.length&&!reachRear(attacker)?front:enemy}
  function canTargetHero(who,attacker){const enemy=game[other(who)].field;return canAttackHero(attacker)&&(bypassFront(attacker)||!enemy.some(isBlocker))}
  function startTurn(who){if(game.over)return;game.turn=who;const s=game[who];s.turns++;s.maxMana=Math.min(s.turns,10);s.mana=s.maxMana;for(const u of s.field)u.attacksUsed=0;game.selected=null;log(`── ${who==='player'?'あなた':'CPU'}の${s.turns}ターン目（マナ${s.mana}） ──`);draw(who,1);render();if(winnerCheck())return;if(who==='cpu')cpuTimer=setTimeout(cpuPlay,500)}
  function endTurn(){if(game.over)return;// HPはここで回復しない。一時ATK効果だけ消す。
    for(const who of ['player','cpu'])for(const u of game[who].field)u.mod=0;
    game.selected=null;startTurn(other(game.turn));
  }
  function summon(who,index){const s=game[who],id=s.hand[index],c=CARDS[id];if(!c||c.type!=='monster'||s.mana<c.cost||!canSummon(who,id))return false;s.hand.splice(index,1);s.mana-=c.cost;const unit={id,sid:++uid,hp:c.hp,mod:0,attacksUsed:0,summonedTurn:s.turns};s.field.push(unit);log(`${who==='player'?'あなた':'CPU'}が${id}を${isBlocker(unit)?'前列':'後列'}に召喚`);switch(c.ability){case'draw':draw(who,c.n);break;case'heal':recover(who,c.n);break;case'blast':damageTargets(other(who),c.n);break}game.selected=null;winnerCheck();return true}
  function cast(who,index,targetSid){const s=game[who],id=s.hand[index],c=CARDS[id];if(!c||c.type!=='spell'||s.mana<c.cost)return false;const foe=other(who);let target=null;if(['dmg','dmgDraw','debuff'].includes(c.ability)){target=game[foe].field.find(u=>u.sid===targetSid);if(!target)return false}if(c.ability==='buff'){target=s.field.find(u=>u.sid===targetSid);if(!target)return false}s.hand.splice(index,1);s.mana-=c.cost;log(`${who==='player'?'あなた':'CPU'}が${id}を使用`);switch(c.ability){case'dmg':damageTargets(foe,c.n,target.sid);break;case'aoe':damageTargets(foe,c.n);break;case'draw':draw(who,c.n);break;case'heal':recover(who,c.n);break;case'buff':target.mod+=c.n;break;case'debuff':target.mod-=c.n;break;case'dmgDraw':damageTargets(foe,c.n,target.sid);draw(who,1);break}game.selected=null;winnerCheck();return true}
  function fight(who,sid,targetSid=null){const foe=other(who),attacker=game[who].field.find(u=>u.sid===sid);if(!attacker||!attackReady(attacker,who))return false;if(targetSid===null){if(!canTargetHero(who,attacker))return false;attacker.attacksUsed++;game[foe].life=Math.max(0,game[foe].life-1);log(`${who==='player'?'あなた':'CPU'}：${attacker.id}が直接攻撃！ ライフ－1`)}else{const target=legalUnitTargets(who,attacker).find(u=>u.sid===targetSid);if(!target)return false;attacker.attacksUsed++;const a=effectiveATK(attacker),b=effectiveATK(target);attacker.hp-=b;target.hp-=a;log(`${attacker.id} → ${target.id}（${a}ダメ / 反撃${b}）`);resolveDeaths()}game.selected=null;winnerCheck();return true}
  function selectSpellTarget(c){return ['dmg','dmgDraw','debuff','buff'].includes(c.ability)}
  function clickHand(index){if(game.turn!=='player'||game.over)return;const id=game.player.hand[index],c=CARDS[id];if(!c)return;if(game.player.mana<c.cost){note('マナが足りないよ');return}if(c.type==='monster'){if(!canSummon('player',id)){note(laneOf(c)==='front'?'前列は1体まで。今のブロッカーがいる間は召喚できないよ':'後列は3体まで。空きを作ろう');return}summon('player',index);render();return}if(selectSpellTarget(c)){if(c.ability==='buff'&&!game.player.field.length){note('強化する味方モンスターがいないよ');return}if(c.ability!=='buff'&&!game.cpu.field.length){note('対象の敵モンスターがいないよ');return}game.selected={kind:'spell',index};render();return}cast('player',index);render()}
  function clickOwnUnit(sid){if(game.turn!=='player'||game.over)return;const sel=game.selected;if(sel?.kind==='spell'){const c=CARDS[game.player.hand[sel.index]];if(c?.ability==='buff'){cast('player',sel.index,sid);render()}else note('敵モンスターを選んでね');return}const u=game.player.field.find(x=>x.sid===sid);if(!u)return;if(!attackReady(u,'player')){note(game.player.turns<=u.summonedTurn?'召喚したターンは攻撃できないよ':'このモンスターは攻撃済み');return}game.selected={kind:'attack',sid};render()}
  function clickEnemyUnit(sid){if(game.turn!=='player'||game.over)return;const sel=game.selected;if(sel?.kind==='attack'){if(!fight('player',sel.sid,sid))note('敵の前列ブロッカーを先に攻撃してね')}else if(sel?.kind==='spell'){const c=CARDS[game.player.hand[sel.index]];if(c?.ability==='buff')note('味方モンスターを選んでね');else cast('player',sel.index,sid)}else note('攻撃する味方か、魔法を選んでね');render()}
  function clickEnemyHero(){if(game.turn!=='player'||game.over)return;const sel=game.selected;if(sel?.kind!=='attack'){note('攻撃する味方モンスターを選んでね');return}if(!fight('player',sel.sid)){const u=game.player.field.find(x=>x.sid===sel.sid);note(u&&!canAttackHero(u)?'ブロッカーは敵プレイヤーを攻撃できないよ':'まず敵の前列ブロッカーを倒そう')}render()}
  function cpuCandidates(){const s=game.cpu,enemy=game.player,ready=s.field.filter(u=>attackReady(u,'cpu'));const list=[];for(let i=0;i<s.hand.length;i++){const c=CARDS[s.hand[i]];if(c.cost>s.mana)continue;if(c.type==='monster'){if(!canSummon('cpu',c.id))continue;const urgency=countLane('cpu','front')===0&&hasTrait(c.id,'blocker')?1.9:0;let score=4+c.cost*.36+urgency+(c.ability==='draw'&&s.hand.length<6?c.n*1.3:0)+(c.ability==='heal'&&s.life<MAX_LIFE?c.n*.65:0)+(c.ability==='blast'?enemy.field.filter(u=>u.hp<=c.n).length*2.2:0);list.push({index:i,score:score+Math.random()*.1});continue}
    if(c.ability==='draw'){if(!s.deck.length||s.hand.length>=MAX_HAND)continue;list.push({index:i,score:s.hand.length<=3?6:s.hand.length<=5?4.3:1.6});continue}
    if(c.ability==='heal'){if(s.life>=MAX_LIFE)continue;list.push({index:i,score:s.life<=5?7:3.5});continue}
    if(c.ability==='aoe'){if(!enemy.field.length)continue;const kills=enemy.field.filter(u=>u.hp<=c.n).length;list.push({index:i,score:2.7+kills*3+enemy.field.length*.4});continue}
    if(c.ability==='dmg'||c.ability==='dmgDraw'){for(const t of enemy.field){const kills=t.hp<=c.n?1:0;let score=2.2+Math.min(c.n,t.hp)*.42+kills*3.6+(isBlocker(t)?1:0)+(c.ability==='dmgDraw'&&s.deck.length&&s.hand.length<MAX_HAND?1.4:0);list.push({index:i,target:t.sid,score})}continue}
    if(c.ability==='buff'){for(const u of ready){const options=legalUnitTargets('cpu',u);if(options.some(t=>t.hp<=effectiveATK(u)+c.n&&t.hp>effectiveATK(u)))list.push({index:i,target:u.sid,score:5.2})}continue}
    if(c.ability==='debuff'&&ready.length&&enemy.field.length){const t=enemy.field.slice().sort((a,b)=>effectiveATK(b)-effectiveATK(a))[0];if(t&&effectiveATK(t)>0)list.push({index:i,target:t.sid,score:3.3});continue}
  }return list.sort((a,b)=>b.score-a.score)}
  function cpuAttackChoice(){const ready=game.cpu.field.filter(u=>attackReady(u,'cpu'));let best=null;for(const u of ready){for(const t of legalUnitTargets('cpu',u)){const a=effectiveATK(u),b=effectiveATK(t),kills=t.hp<=a,survive=u.hp>b;const block=isBlocker(t);let score=(kills?6.5:1.5)+(survive?2.4:-1.5)+Math.min(a,t.hp)*.6+(block?2.5:0)+(kills&&survive?1:0);if(a===0)score-=3;if(!best||score>best.score)best={sid:u.sid,target:t.sid,score}}
      if(canTargetHero('cpu',u)){const score=game.player.life<=2?18:game.player.life<=4?9.2:5.4;if(!best||score>best.score)best={sid:u.sid,target:null,score}}
    }return best}
  function cpuPlay(){if(game.over||game.turn!=='cpu')return;let count=0;while(count++<25&&!game.over){const actions=cpuCandidates();if(!actions.length)break;const act=actions[0];const card=CARDS[game.cpu.hand[act.index]];if(card.type==='monster')summon('cpu',act.index);else cast('cpu',act.index,act.target)}let a=0;while(a++<15&&!game.over){const move=cpuAttackChoice();if(!move)break;if(!fight('cpu',move.sid,move.target))break}render();if(!game.over)cpuTimer=setTimeout(endTurn,450)}
  function escapeHTML(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function cardHTML(c,u,side){const hand=!u;const selected=hand?game.selected?.kind==='spell'&&game.selected.index===side:game.selected?.kind==='attack'&&game.selected.sid===u.sid;const playerTurn=game.turn==='player'&&!game.over;let targetable=false;if(!hand&&playerTurn){const sel=game.selected;if(side==='cpu'&&sel?.kind==='attack'){const attacker=game.player.field.find(x=>x.sid===sel.sid);targetable=!!attacker&&legalUnitTargets('player',attacker).some(t=>t.sid===u.sid)}else if(side==='cpu'&&sel?.kind==='spell'){const spell=CARDS[game.player.hand[sel.index]];targetable=spell?.ability!=='buff'}else if(side==='player'&&sel?.kind==='spell'){const spell=CARDS[game.player.hand[sel.index]];targetable=spell?.ability==='buff'}}const ready=!hand&&side==='player'&&playerTurn&&attackReady(u,'player');const unplayable=hand&&(game.player.mana<c.cost||(c.type==='monster'&&!canSummon('player',c.id)));const classes=[hand?'handCard':'unit',hand&&c.type==='spell'?'spell':'',!hand&&side==='cpu'?'enemyUnit':'',!hand&&isBlocker(u)?'blocker':'',!hand&&!attackReady(u,side)?'fresh':'',ready?'ready':'',selected?'selected':'',targetable?'targetable':'',unplayable?'unplayable':''].filter(Boolean).join(' ');const label=abilityLabel(c);return `<div class="${classes}" role="button" tabindex="0" aria-label="${escapeHTML(c.id+' '+label)}"><div class="idrow"><span class="id">${c.id}</span><span class="cost">${c.cost}</span></div><div class="art">${art(c)}</div><div class="effect ${c.ability||hasTrait(c.id,'blocker')?'':'noAbility'}">${label}</div>${c.type==='monster'?`<div class="stats"><span class="statA">⚔ ${hand?c.atk:effectiveATK(u)}</span><span class="statH">♥ ${hand?c.hp:u.hp}/${c.hp}</span></div>`:`<div class="stats"><span style="color:#ffdfaa">魔法 ✦</span></div>`}${!hand&&u.attacksUsed?`<span class="atkCount">${u.attacksUsed}/${maxAttacks(u)}回</span>`:''}</div>`}
  function makeSlots(who,lane){const f=document.createDocumentFragment(),units=game[who].field.filter(u=>laneOf(CARDS[u.id])===lane),limit=lane==='front'?MAX_FRONT:MAX_REAR;for(let i=0;i<limit;i++){const slot=document.createElement('div');slot.className='slot';const u=units[i];if(u){slot.innerHTML=cardHTML(CARDS[u.id],u,who);const btn=slot.firstChild;const action=()=>who==='player'?clickOwnUnit(u.sid):clickEnemyUnit(u.sid);btn.addEventListener('click',action);btn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action()}})}f.append(slot)}return f}
  function loadRecord(){try{return JSON.parse(localStorage.getItem('bvb_record_v1'))||{win:0,lose:0,draw:0}}catch{return {win:0,lose:0,draw:0}}}
  function updateRecord(){const r=loadRecord();el('record').textContent=`勝敗記録：${r.win||0}勝 / ${r.lose||0}敗 / ${r.draw||0}分`}
  function render(){if(!game)return;el('turnChip').textContent=game.over?'対戦終了':game.turn==='player'?'🟢 あなたのターン':'🟣 CPUのターン';el('manaTop').textContent=`💠 ${game.player.mana}/${game.player.maxMana}`;el('manaHand').textContent=`マナ ${game.player.mana}/${game.player.maxMana}`;el('cpuLife').innerHTML=`♥ ${game.cpu.life} <span>/10</span>`;el('playerLife').innerHTML=`♥ ${game.player.life} <span>/10</span>`;el('cpuInfo').textContent=`山札${game.cpu.deck.length}・手札${game.cpu.hand.length}`;el('playerInfo').textContent=`山札${game.player.deck.length}・手札${game.player.hand.length}`;el('handCount').textContent=`${game.player.hand.length}/7`;el('phase').textContent=game.turn==='player'?'🙂 あなたの番':'🤖 CPUの番';el('endBtn').disabled=game.turn!=='player'||game.over;el('cancelBtn').disabled=!game.selected;const attacker=game.player.field.find(u=>game.selected?.kind==='attack'&&game.selected.sid===u.sid);el('cpuHero').classList.toggle('targetable',game.turn==='player'&&!game.over&&!!attacker&&canTargetHero('player',attacker));for(const who of ['cpu','player'])for(const lane of ['front','rear'])el(who+(lane==='front'?'Front':'Rear')).replaceChildren(makeSlots(who,lane));let hint='手札をタップで召喚・魔法。味方をタップで攻撃';if(game.over)hint='対戦終了。やり直すと再戦できるよ';else if(game.turn==='cpu')hint='CPUが行動中…';else if(game.selected?.kind==='attack')hint=game.cpu.field.some(isBlocker)&&attacker&&!bypassFront(attacker)?'🛡 まず敵の前列ブロッカーを攻撃':'後列モンスターかCPUのライフを選んで攻撃';else if(game.selected?.kind==='spell'){const c=CARDS[game.player.hand[game.selected.index]];hint=c?.ability==='buff'?'強化する味方モンスターを選択':'魔法を当てる敵モンスターを選択（前列・後列どちらも可）'}el('hint').textContent=hint;const hf=document.createDocumentFragment();game.player.hand.forEach((id,i)=>{const w=document.createElement('div');w.innerHTML=cardHTML(CARDS[id],null,i);const card=w.firstChild;const action=()=>clickHand(i);card.addEventListener('click',action);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action()}});hf.append(card)});el('hand').replaceChildren(hf);el('log').innerHTML=game.logs.slice(0,6).map(s=>`<div>${escapeHTML(s)}</div>`).join('');updateRecord()}
  function finish(result){game.over=true;game.result=result;clearTimeout(cpuTimer);const r=loadRecord();r[result]=(r[result]||0)+1;try{localStorage.setItem('bvb_record_v1',JSON.stringify(r))}catch{}const title=result==='win'?'🎉 勝利！':result==='lose'?'💫 敗北！':'🤝 引き分け';log(title);render();showModal(title,`<p>あなた ${game.player.life} ライフ ／ CPU ${game.cpu.life} ライフ</p><p>Ver.0.2では前列ブロッカーを先に突破。HPはターンをまたいで残るよ。</p>`,true)}
  function showModal(title,content,rematch=false){el('modalTitle').textContent=title;el('modalContent').innerHTML=content;el('modalAlt').style.display=rematch?'inline-block':'none';el('modal').classList.add('show')}
  function hideModal(){el('modal').classList.remove('show')}
  function newGame(){clearTimeout(cpuTimer);uid=0;game={player:newSide(),cpu:newSide(),turn:null,selected:null,over:false,result:null,logs:[]};draw('player',5);draw('cpu',5);log('デッキB vs デッキB｜Ver.0.2 対戦開始！');hideModal();startTurn(Math.random()<.5?'player':'cpu')}
  el('endBtn').addEventListener('click',()=>{if(game.turn==='player'&&!game.over)endTurn()});
  el('cpuHero').addEventListener('click',clickEnemyHero);
  el('cancelBtn').addEventListener('click',()=>{game.selected=null;render()});
  el('rulesBtn').addEventListener('click',()=>showModal('📘 Ver.0.2のルール',`<ul><li>同じデッキB 30枚同士。初期ライフ10、初期手札5枚。先攻・後攻はランダム。</li><li>各自のターン開始時に1枚ドロー。マナは自分のターンごとに1→最大10へ増加、全回復。</li><li>手札は最大7枚。<b>前列ブロッカー1体・後列通常モンスター3体</b>まで。満員の列には追加召喚できず、入れ替えもできない。</li><li><b>M-01・M-03はブロッカー。</b>ブロッカーは敵モンスターに攻撃できるが、敵プレイヤーには直接攻撃できない。</li><li><b>敵ブロッカーがいる間、攻撃先はそのブロッカーだけ。</b>敵の前列が空なら、後列モンスターや敵プレイヤーを自由に攻撃できる。</li><li>召喚したターンは攻撃できない。連撃は次の自ターンから2回攻撃可能。</li><li>戦闘ダメージは双方同時。<b>HPはターン終了時に回復せず、ダメージが残る。</b>HP0以下で破壊。</li><li>魔法は自分のターンに使用。ダメージ魔法はブロッカーを無視して後列にも使用可能。ATK増減は使用したターンが終わると解除。</li><li>直接攻撃1回につきライフ1ダメージ。ライフ0で敗北。山札切れによる敗北はなし。</li><li>双方ともプレイヤーに攻撃できるモンスターが今後出せなくなった場合、引き分け。</li></ul>`));
  el('modalOk').addEventListener('click',hideModal);el('modalAlt').addEventListener('click',newGame);
  el('newBtn').addEventListener('click',()=>showModal('🔄 対戦をやり直す？','<p>現在の試合を終了して、新しくデッキB同士の対戦を始めます。</p>',true));
  window.addEventListener('contextmenu',e=>e.preventDefault());
  newGame();
  // 手動・自動動作確認用（通常のゲーム操作には不要）
  window.__BVB_TEST__={getState:()=>JSON.parse(JSON.stringify(game)),getMutableState:()=>game,cards:CARDS,deck:DECK_B,newGame,startTurn,endTurn,draw,summon,cast,fight,attackReady,resolveDeaths,canSummon,canTargetHero,legalUnitTargets,cpuPlay,render};
})();
