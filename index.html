@media(min-width:600px) and (orientation:portrait){#app{padding-left:22px;padding-right:22px;grid-template-rows:46px 56px 12px minmax(250px,1fr) 12px 56px 52px 196px 16px;gap:5px}.playerBar{padding:8px 16px}.playerName{font-size:15px}.playerMeta{font-size:11px}.health{font-size:28px}.brand{font-size:17px}.version{font-size:11px}.laneTrack{padding:8px 9px 10px;grid-template-rows:32px minmax(0,1fr) 46px minmax(0,1fr)}.laneTitle{font-size:14px}.unitCard{max-height:205px;max-width:100%}.emptySlot{height:min(100%,205px);max-width:100%}.cardId{font-size:12px}.cardName{font-size:11px}.cardAbility{font-size:11px}.cardStats{font-size:15px}.handCard{height:156px;width:117px;flex-basis:117px}.handHead{font-size:14px}.hint{font-size:13px}.modeBtn,.cancelBtn,.endBtn{font-size:12px}.detailInfo{font-size:15px}}

/* v0.6 UI-only test: seven visible hand cards and compact preview. */
.handSection{gap:3px}
.handPreview{flex:0 0 48px;min-height:0;display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:7px;background:#193449;border:1px solid #537588;overflow:hidden}
.handPreview.confirming{background:#32422f;border-color:#a3cc82}
.previewText{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.previewText strong{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:11px;color:#ffe3a0;line-height:1.2}
.previewText span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:10px;line-height:1.3;color:#dce9ee}
.previewAction{flex:0 0 auto;border:1px solid #e6e5ac;background:#b6dfa0;color:#163022;border-radius:6px;padding:9px 8px;font-size:11px;font-weight:900;min-height:35px}
.handScroll{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:stretch;gap:3px;min-height:0;flex:1;overflow:hidden;padding:0;scroll-snap-type:none}
.handScroll .handCard{width:100%;height:100%;flex:initial;min-width:0;padding:2px;gap:1px;border-radius:5px}
.handScroll .handCard .cardName,.handScroll .handCard .cardAbility{display:none}
.handScroll .cardTop{min-height:14px;gap:0}
.handScroll .cardId{font-size:8px;letter-spacing:-.04em}
.handScroll .cardCost{width:15px;height:15px;flex:0 0 15px;font-size:10px}
.handScroll .cardArt{font-size:19px;border-radius:3px}
.handScroll .cardStats{font-size:10px;min-height:13px;gap:0}
.handScroll .cardStats span{white-space:nowrap}
.handScroll .handCard.spell .cardStats{font-size:8px!important;white-space:nowrap;justify-content:center}
@media(max-width:370px){.handScroll{gap:2px}.handScroll .handCard{padding:1px}.handScroll .cardId{font-size:7px}.handScroll .cardCost{width:13px;height:13px;flex-basis:13px;font-size:8px}.handScroll .cardStats{font-size:9px}.handPreview{flex-basis:43px;padding:3px 5px}}
@media(max-height:720px) and (orientation:portrait){.handPreview{flex-basis:41px}.previewText span{font-size:9px}}
@media(min-width:600px) and (orientation:portrait){.handPreview{flex-basis:57px;padding:7px 10px}.previewText strong{font-size:14px}.previewText span{font-size:12px}.handScroll{gap:6px}.handScroll .handCard{padding:5px;gap:2px}.handScroll .cardTop{min-height:20px}.handScroll .cardId{font-size:11px}.handScroll .cardCost{width:21px;height:21px;flex-basis:21px;font-size:12px}.handScroll .cardStats{font-size:14px;min-height:19px}.handScroll .cardArt{font-size:27px}.handScroll .handCard.spell .cardStats{font-size:11px!important}}


/* v0.6.1: readable attack status + explicit end-turn warning */
.unitCard.ownReady:not(.selected){border:2px solid #9de8b1;box-shadow:0 0 0 1px #94e7ac45,0 0 13px #56dc9765}
.unitCard.ownSick:not(.selected){border-color:#9baac8}
.unitCard.ownSpent:not(.selected){border-color:#7f929e;filter:saturate(.72)}
.unitStatus{position:absolute;z-index:3;top:22px;left:3px;right:3px;min-height:17px;display:flex;align-items:center;justify-content:center;border-radius:4px;padding:2px 2px;font-size:9px;font-weight:950;line-height:1.1;white-space:nowrap;letter-spacing:-.02em;pointer-events:none;box-shadow:0 1px 5px #0009;border:1px solid transparent}
.unitStatus.can{background:#164536ec;color:#b7ffcf;border-color:#8ee6ae}
.unitStatus.sick{background:#293b58ec;color:#dbe6ff;border-color:#829fcb}
.unitStatus.spent{background:#28343df0;color:#d1dce2;border-color:#8396a3}
.endBtn.pendingAttacks{box-shadow:0 0 0 2px #f4cb83a6}
.endConfirmDialog{width:min(400px,95vw)}
.endConfirmDialog h2{font-size:18px;color:#ffe2a3}
.endConfirmDialog p{margin:4px 0 12px}
.endPendingList{border:1px solid #52758a;background:#102a3d;border-radius:9px;padding:9px 12px;display:flex;flex-direction:column;gap:6px}
.endPendingItem{font-size:12px;line-height:1.35;color:#edf6fa}
.endPendingItem strong{color:#a8f3c6}
.endConfirmActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.endConfirmActions button{min-height:44px;padding:9px 7px;font-size:12px;font-weight:900;border-radius:8px}
.endConfirmBack{border:1px solid #88bfa6;background:#b1ead0;color:#11362e}
.endConfirmGo{border:1px solid #8d99a8;background:#31465a;color:#e8f2f8}
@media(max-width:370px){.unitStatus{top:20px;min-height:15px;font-size:8px;padding:1px}}
@media(min-width:600px) and (orientation:portrait){.unitStatus{top:28px;min-height:22px;font-size:12px}.endConfirmDialog h2{font-size:20px}}

</style>

<body>
<main id="app">
  <header class="top"><div class="brand">⚔ DREI KAMPF <span class="version">UI試作 v0.6.1</span></div><div class="top-right"><span class="phaseChip" id="phaseChip">準備中</span><button class="tinyBtn" id="rulesBtn">ルール</button><button class="tinyBtn" id="restartBtn">再戦</button></div></header>
  <section class="playerBar enemy"><div class="playerBadge"><div class="avatar">🤖</div><div><div class="playerName">CPU <span class="version">デッキB</span></div><div class="playerMeta" id="cpuInfo">山札50・手札5</div></div></div><div class="health"><span class="heart">♥</span><span id="cpuHp">10</span><small>/10</small></div></section>
  <div class="bus enemyBus" aria-hidden="true"><span></span><span></span><span></span></div>
  <section id="lanes" class="lanes" aria-label="3本の独立したバトルレーン"></section>
  <div class="bus" aria-hidden="true"><span></span><span></span><span></span></div>
  <section class="playerBar"><div class="playerBadge"><div class="avatar">🙂</div><div><div class="playerName">あなた <span class="version">デッキB</span></div><div class="playerMeta" id="playerInfo">山札50・手札5</div></div></div><div class="health"><span class="heart">♥</span><span id="playerHp">10</span><small>/10</small></div></section>
  <section class="controls"><div id="hint" class="hint" aria-live="polite">カードを選ぼう</div><button id="cancelBtn" class="cancelBtn">✕ キャンセル</button><button id="inspectBtn" class="modeBtn" aria-pressed="false">🔎 詳細</button><button id="endBtn" class="endBtn">ターン終了 ▶</button></section>
  <section class="handSection"><div class="handHead"><span>🃏 手札 <span id="handCount">0/7</span></span><strong id="mana">💠 0/0</strong></div><div id="handPreview" class="handPreview" aria-live="polite"><div class="previewText"><strong>手札を選んでね</strong><span>7枚すべて表示。選択すると効果がここに出るよ。</span></div></div><div id="hand" class="handScroll" aria-label="自分の手札（横スクロールなし）"></div></section>
  <footer class="foot"><span id="record">戦績：0勝 0敗 0分</span><span>3レーン・移動なし・ダメージ持続</span></footer>
</main>
<div class="rotateHint"><div><strong>📱 縦向きで遊ぼう</strong><p>3レーン試作版は縦画面向け！<br>スマホを縦にするとバトル画面が表示されるよ。</p></div></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="modal"><div class="dialog"><h2 id="modalTitle"></h2><div id="modalBody"></div><button class="dialogBtn" id="modalClose">閉じる</button><button class="dialogBtn secondary" id="modalReplay" style="display:none">新しく対戦</button></div></div>
<div class="overlay" id="endConfirmOverlay" role="dialog" aria-modal="true" aria-label="攻撃を残してターン終了する確認" aria-hidden="true">
  <div class="dialog endConfirmDialog">
    <h2>⚠️ まだ攻撃できます！</h2>
    <p id="endConfirmDescription"></p>
    <div id="endPendingList" class="endPendingList"></div>
    <div class="endConfirmActions">
      <button id="endConfirmBack" class="endConfirmBack">攻撃に戻る</button>
      <button id="endConfirmGo" class="endConfirmGo">そのまま終了</button>
    </div>
  </div>
</div>
<div class="overlay" id="detailOverlay" role="dialog" aria-label="カード詳細" aria-hidden="true"><div class="detail"><div class="detailHead"><h2 id="detailTitle">カード詳細</h2><button id="detailClose" class="tinyBtn">✕ 閉じる</button></div><div class="detailBody"><div id="detailArt" class="detailArt"></div><div id="detailInfo" class="detailInfo"></div></div></div></div>
<script>
'use strict';
(()=>{
  const MONSTERS=[
    ['M-01',1,1,2,'',0],['M-02',1,1,1,'legacy',1],['M-03',2,2,3,'',0],['M-04',2,1,2,'draw',1],['M-05',2,1,1,'double',0],
    ['M-06',3,3,4,'',0],['M-07',3,2,3,'heal',1],['M-08',3,2,2,'blast',1],['M-09',4,4,5,'',0],['M-10',4,2,3,'double',0],
    ['M-11',4,3,3,'legacy',1],['M-12',5,5,6,'',0],['M-13',5,3,3,'draw',2],['M-14',5,3,4,'heal',2],['M-15',6,6,7,'',0],
    ['M-16',6,4,5,'blast',2],['M-17',7,5,6,'legacy',2],['M-18',8,4,9,'',0],['M-19',9,6,7,'blast',3],['M-20',10,8,8,'',0]
  ];
  const SPELLS=[['S-01',2,'dmg',2],['S-02',4,'dmg',4],['S-03',3,'aoe',1],['S-04',5,'aoe',2],['S-05',2,'draw',1],['S-06',4,'draw',2],['S-07',2,'heal',2],['S-08',2,'buff',2],['S-09',2,'debuff',2],['S-10',5,'dmgDraw',3]];
  const CARDS={};
  for(const [id,cost,atk,hp,ability,n] of MONSTERS)CARDS[id]={id,type:'monster',cost,atk,hp,ability,n};
  for(const [id,cost,ability,n] of SPELLS)CARDS[id]={id,type:'spell',cost,ability,n};
  // v0.4.1の同じ50枚。今回「ブロッカー」は廃止、M-01/M-03は暫定能力なし。
  const DECK_B={'M-01':3,'M-02':3,'M-03':3,'M-04':3,'M-05':2,'M-06':3,'M-07':2,'M-08':2,'M-09':2,'M-10':2,'M-11':2,'M-12':2,'M-13':2,'M-14':1,'M-15':1,'M-16':1,'M-18':1,'S-01':3,'S-02':2,'S-03':2,'S-05':2,'S-06':1,'S-07':2,'S-08':1,'S-09':1,'S-10':1};
  const MAX_HAND=7,MAX_LIFE=10,LANE_NAMES=['左','中央','右'];
  if(Object.values(DECK_B).reduce((s,n)=>s+n,0)!==50)throw Error('デッキ枚数が不正');
  const el=id=>document.getElementById(id),other=who=>who==='player'?'cpu':'player',owner=who=>who==='player'?'あなた':'CPU';
  let g=null,seq=0,session=0,inspect=false,toastTimeout=null;
  function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function side(){const deck=[];for(const [id,n] of Object.entries(DECK_B))for(let i=0;i<n;i++)deck.push(id);return {life:10,deck:shuffle(deck),hand:[],field:[],turns:0,mana:0,maxMana:0}}
  function pushLog(message){g.logs.unshift(message);g.logs.length=Math.min(g.logs.length,80);g.status=message}
  function toast(message){clearTimeout(toastTimeout);el('toast').textContent=message;el('toast').classList.add('show');toastTimeout=setTimeout(()=>el('toast').classList.remove('show'),1700)}
  function draw(who,n){const s=g[who];let actual=0;while(actual<n&&s.hand.length<MAX_HAND&&s.deck.length){s.hand.push(s.deck.pop());actual++}if(actual)pushLog(`${owner(who)}：${actual}枚ドロー`);return actual}
  function healLife(who,n){const s=g[who],count=Math.min(n,MAX_LIFE-s.life);s.life+=count;if(count)pushLog(`${owner(who)}のライフ＋${count}`)}
  function unitAt(who,lane){return g[who].field.find(u=>u.lane===lane)||null}
  function canSummon(who,id,lane){return Number.isInteger(lane)&&lane>=0&&lane<3&&CARDS[id]?.type==='monster'&&!unitAt(who,lane)}
  function atk(u){return Math.max(0,CARDS[u.id].atk+u.mod)}
  function maxAttacks(u){return CARDS[u.id].ability==='double'?2:1}
  function ready(who,u){return g[who].turns>u.summonedTurn&&u.attacksUsed<maxAttacks(u)}
  function availableAttacks(who,u){return Math.max(0,maxAttacks(u)-u.attacksUsed)}
  function ownAttackStatus(u){
    // Only show actionable states for the player on their own turn.
    if(g.over||g.turn!=='player')return null;
    if(g.player.turns<=u.summonedTurn)return {kind:'sick',text:'💤 召喚酔い'};
    if(ready('player',u))return {kind:'can',text:maxAttacks(u)>1?`⚔ あと${availableAttacks('player',u)}回`:'⚔ 攻撃可'};
    return {kind:'spent',text:'✓ 攻撃済'};
  }
  function pendingPlayerAttacks(){return g.player.field.filter(u=>ready('player',u))}
  function hideEndConfirm(){el('endConfirmOverlay').classList.remove('show');el('endConfirmOverlay').setAttribute('aria-hidden','true')}
  function requestEndTurn(){
    if(g.over||g.turn!=='player')return;
    const pending=pendingPlayerAttacks();
    if(!pending.length){endTurn();return}
    const total=pending.reduce((n,u)=>n+availableAttacks('player',u),0);
    el('endConfirmDescription').textContent=`攻撃できるモンスターが${pending.length}体、攻撃が合計${total}回残っています。このままターンを終了しますか？`;
    const rows=el('endPendingList');rows.replaceChildren();
    for(const u of pending){
      const line=document.createElement('div');line.className='endPendingItem';
      const name=document.createElement('strong');name.textContent=`${LANE_NAMES[u.lane]}レーン：${cardName(u.id)}`;
      line.append(name,document.createTextNode(`（あと${availableAttacks('player',u)}回）`));rows.append(line);
    }
    el('endConfirmOverlay').classList.add('show');el('endConfirmOverlay').setAttribute('aria-hidden','false');
    el('endConfirmBack').focus();
  }
  function resolveDeaths(){const dead=[];for(const who of ['player','cpu']){const living=[];for(const u of g[who].field){if(u.hp<=0)dead.push({who,u});else living.push(u)}g[who].field=living}for(const {who,u} of dead)pushLog(`${owner(who)}の${u.id}が破壊された`);for(const {who,u} of dead){const c=CARDS[u.id];if(c.ability==='legacy'){pushLog(`${u.id}の遺志${c.n}が発動`);draw(who,c.n)}}}
  function damage(who,n,targetSid=null){const targets=g[who].field.filter(u=>targetSid===null||u.sid===targetSid);for(const u of targets)u.hp-=n;if(targets.length)pushLog(`${owner(who)}の${targets.length}体に${n}ダメージ`);resolveDeaths()}
  function noCards(who){const s=g[who];return s.deck.length===0&&s.hand.length===0&&s.field.length===0}
  function hasFutureAttacker(who){const s=g[who];return s.field.length>0||s.hand.some(id=>CARDS[id].type==='monster')||s.deck.some(id=>CARDS[id].type==='monster')}
  function winnerCheck(){if(g.over)return true;if(g.player.life<=0||g.cpu.life<=0){finish(g.player.life<=0&&g.cpu.life<=0?'draw':g.cpu.life<=0?'win':'lose');return true}const a=noCards('player'),b=noCards('cpu');if(a||b){finish(a&&b?'draw':b?'win':'lose');return true}if(!hasFutureAttacker('player')&&!hasFutureAttacker('cpu')){finish('draw');return true}return false}
  function summon(who,handIndex,lane){if(g.over||g.turn!==who)return false;const s=g[who],id=s.hand[handIndex],c=CARDS[id];if(!c||c.type!=='monster'||s.mana<c.cost||!canSummon(who,id,lane))return false;s.hand.splice(handIndex,1);s.mana-=c.cost;s.field.push({id,sid:++seq,lane,hp:c.hp,mod:0,attacksUsed:0,summonedTurn:s.turns});pushLog(`${owner(who)}が${LANE_NAMES[lane]}レーンに${id}を召喚`);switch(c.ability){case'draw':pushLog(`${id}のドロー${c.n}発動`);draw(who,c.n);break;case'heal':pushLog(`${id}の治癒${c.n}発動`);healLife(who,c.n);break;case'blast':pushLog(`${id}の爆炎${c.n}発動`);damage(other(who),c.n);break}g.selected=null;winnerCheck();return true}
  const needsTarget=c=>['dmg','dmgDraw','buff','debuff'].includes(c.ability);
  function cast(who,handIndex,targetSid){if(g.over||g.turn!==who)return false;const s=g[who],id=s.hand[handIndex],c=CARDS[id];if(!c||c.type!=='spell'||s.mana<c.cost)return false;const foe=other(who),targetSide=c.ability==='buff'?who:foe;const target=needsTarget(c)?g[targetSide].field.find(u=>u.sid===targetSid):null;if(needsTarget(c)&&!target)return false;s.hand.splice(handIndex,1);s.mana-=c.cost;pushLog(`${owner(who)}が魔法${id}を使用！`);switch(c.ability){case'dmg':damage(foe,c.n,target.sid);break;case'aoe':damage(foe,c.n);break;case'draw':draw(who,c.n);break;case'heal':healLife(who,c.n);break;case'buff':target.mod+=c.n;break;case'debuff':target.mod-=c.n;break;case'dmgDraw':damage(foe,c.n,target.sid);draw(who,1);break}g.selected=null;winnerCheck();return true}
  // Normal attacks only hit an opposing unit in the SAME lane. When vacant, hit shared hero life for 1.
  function fight(who,sid,targetSid=null){if(g.over||g.turn!==who)return false;const foe=other(who),u=g[who].field.find(x=>x.sid===sid);if(!u||!ready(who,u))return false;const facing=unitAt(foe,u.lane);if(facing&&facing.sid!==targetSid)return false;if(!facing&&targetSid!==null)return false;u.attacksUsed++;if(facing){const a=atk(u),b=atk(facing);u.hp-=b;facing.hp-=a;pushLog(`${LANE_NAMES[u.lane]}：${u.id}が${facing.id}へ攻撃！ ${a}ダメ／反撃${b}`);resolveDeaths()}else{g[foe].life=Math.max(0,g[foe].life-1);pushLog(`${LANE_NAMES[u.lane]}：${u.id}の直接攻撃！ ${owner(foe)}のライフ－1`)}g.selected=null;winnerCheck();return true}
  function startTurn(who){if(g.over)return;g.turn=who;const s=g[who];s.turns++;s.maxMana=Math.min(s.turns,10);s.mana=s.maxMana;for(const u of s.field)u.attacksUsed=0;g.selected=null;pushLog(`── ${owner(who)}の${s.turns}ターン目 ──`);draw(who,1);render();if(winnerCheck())return;if(who==='cpu'){const current=session;setTimeout(()=>cpuPlay(current),650)}}
  function endTurn(){if(g.over)return;for(const who of ['player','cpu'])for(const u of g[who].field)u.mod=0;g.selected=null;startTurn(other(g.turn))}
  function handTap(index){
     if(g.over||g.turn!=='player')return;
     const id=g.player.hand[index],c=CARDS[id];if(!c)return;
     // Tapping the same selected card cancels without spending mana.
     if(g.selected?.index===index&&['summon','spell','spellConfirm','handInfo'].includes(g.selected.kind)){g.selected=null;render();return}
     // Allow viewing unplayable cards without spending mana.
     if(g.player.mana<c.cost){g.selected={kind:'handInfo',index};toast('マナが足りないよ');render();return}
     if(c.type==='monster'){
       if(g.player.field.length>=3){g.selected={kind:'handInfo',index};toast('3本とも埋まっているよ');render();return}
       g.selected={kind:'summon',index};render();return;
     }
     if(needsTarget(c)){
       const pool=c.ability==='buff'?g.player.field:g.cpu.field;
       if(!pool.length){g.selected={kind:'handInfo',index};toast(c.ability==='buff'?'味方モンスターがいないよ':'敵モンスターがいないよ');render();return}
       g.selected={kind:'spell',index};render();return;
     }
     // Spells without targets wait for explicit confirmation.
     g.selected={kind:'spellConfirm',index};render();
   }
   function confirmSpell(){
     if(g.over||g.turn!=='player'||g.selected?.kind!=='spellConfirm')return;
     const index=g.selected.index;
     if(cast('player',index))render();else toast('魔法を使えないよ');
   }
  function ownSlotTap(lane){if(g.over||g.turn!=='player')return;const u=unitAt('player',lane),sel=g.selected;if(sel?.kind==='summon'){if(u){toast('ここにはもうモンスターがいるよ');return}if(summon('player',sel.index,lane))render();else toast('召喚できないよ');return}if(sel?.kind==='handInfo'||sel?.kind==='spellConfirm'){toast('カードの説明を確認してね');return}if(sel?.kind==='spell'){const c=CARDS[g.player.hand[sel.index]];if(c?.ability==='buff'&&u){if(cast('player',sel.index,u.sid))render()}else toast('魔法の対象を確認してね');return}if(!u){toast('手札のモンスターを選んで、このレーンをタップしてね');return}if(!ready('player',u)){toast(g.player.turns<=u.summonedTurn?'召喚したターンは攻撃できないよ':'このターンは攻撃済みだよ');return}g.selected={kind:'attack',sid:u.sid,lane};render()}
  function enemySlotTap(lane){if(g.over||g.turn!=='player')return;const u=unitAt('cpu',lane),sel=g.selected;if(sel?.kind==='handInfo'||sel?.kind==='spellConfirm'){toast('カードの説明を確認してね');return}if(sel?.kind==='spell'){const c=CARDS[g.player.hand[sel.index]];if(c?.ability==='buff'){toast('味方モンスターを選んでね');return}if(!u){toast('魔法の対象がいないよ');return}if(cast('player',sel.index,u.sid))render();return}if(sel?.kind==='attack'){if(sel.lane!==lane){toast('正面の同じレーンしか攻撃できないよ');return}const did=fight('player',sel.sid,u?.sid??null);if(!did)toast('攻撃できないよ');render();return}toast('攻撃する味方モンスターを先に選んでね')}
  function cpuOptions(){const s=g.cpu,foe=g.player,list=[];for(let i=0;i<s.hand.length;i++){const c=CARDS[s.hand[i]];if(c.cost>s.mana)continue;if(c.type==='monster'){for(let lane=0;lane<3;lane++){if(!canSummon('cpu',c.id,lane))continue;const threat=unitAt('player',lane);const strong=threat?Math.max(0,c.hp-atk(threat))*.12:0;const block=threat?3.0+(ready('player',threat)?1:0):1.1;const kills=threat&&atk(threat)>0&&c.atk>=threat.hp?1.2:0;let score=3+c.cost*.35+block+strong+kills+(c.ability==='draw'&&s.hand.length<6?c.n:0)+(c.ability==='blast'?foe.field.filter(u=>u.hp<=c.n).length*1.5:0)+(c.ability==='heal'&&s.life<7?.7:0);list.push({index:i,lane,score:score+Math.random()*.1})}continue}
   if(c.ability==='draw'){if(s.hand.length>=MAX_HAND||!s.deck.length)continue;list.push({index:i,score:s.hand.length<=3?6:s.hand.length<=5?4.3:1.5});continue}
   if(c.ability==='heal'){if(s.life>=MAX_LIFE)continue;list.push({index:i,score:s.life<=4?8:4});continue}
   if(c.ability==='aoe'){if(!foe.field.length)continue;const kills=foe.field.filter(u=>u.hp<=c.n).length;list.push({index:i,score:2.2+foe.field.length*.7+kills*2.6});continue}
   if(c.ability==='dmg'||c.ability==='dmgDraw'){for(const t of foe.field){const kills=t.hp<=c.n;list.push({index:i,target:t.sid,score:2.1+Math.min(c.n,t.hp)*.45+(kills?3.5:0)+(c.ability==='dmgDraw'&&s.hand.length<MAX_HAND?1:0)})}continue}
   if(c.ability==='buff'){for(const u of s.field.filter(u=>ready('cpu',u))){const foeUnit=unitAt('player',u.lane);if(foeUnit&&foeUnit.hp>atk(u)&&foeUnit.hp<=atk(u)+c.n)list.push({index:i,target:u.sid,score:6});}continue}
   if(c.ability==='debuff'){for(const t of foe.field){if(atk(t)>0&&unitAt('cpu',t.lane))list.push({index:i,target:t.sid,score:3.1+atk(t)*.3})}continue}
  }return list.sort((a,b)=>b.score-a.score)}
  function cpuBestAttack(){let best=null;for(const u of g.cpu.field.filter(u=>ready('cpu',u))){const foe=unitAt('player',u.lane);let score;if(foe){const damage=atk(u),counter=atk(foe);score=(foe.hp<=damage?5.7:1.2)+(u.hp>counter?2.1:-1.2)+Math.min(damage,foe.hp)*.43;if(damage===0)score-=4}else score=g.player.life<=3?14:7.4;const candidate={sid:u.sid,target:foe?.sid??null,score};if(!best||score>best.score)best=candidate}return best}
  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  async function cpuPlay(id){if(id!==session||g.over||g.turn!=='cpu')return;let n=0;while(n++<20&&id===session&&!g.over){const options=cpuOptions();if(!options.length)break;const action=options[0],card=CARDS[g.cpu.hand[action.index]];const success=card.type==='monster'?summon('cpu',action.index,action.lane):cast('cpu',action.index,action.target);if(!success)break;render();toast(g.status);await sleep(670)}n=0;while(n++<10&&id===session&&!g.over){const action=cpuBestAttack();if(!action)break;if(!fight('cpu',action.sid,action.target))break;render();toast(g.status);await sleep(760)}if(id===session&&!g.over){await sleep(430);if(id===session&&!g.over&&g.turn==='cpu')endTurn()}}
  function abilityName(c){if(c.type==='spell')return ({dmg:`敵1体${c.n}ダメ`,aoe:`敵全体${c.n}ダメ`,draw:`${c.n}枚ドロー`,heal:`ライフ${c.n}回復`,buff:`ATK＋${c.n}`,debuff:`ATK－${c.n}`,dmgDraw:'3ダメ＋ドロー'})[c.ability];return ({'':'能力なし',legacy:`遺志${c.n}`,draw:`ドロー${c.n}`,double:'連撃',heal:`治癒${c.n}`,blast:`爆炎${c.n}`})[c.ability]}
  function abilityDesc(c){if(c.type==='spell')return ({dmg:`敵モンスター1体に${c.n}ダメージ。レーンは問わない。`,aoe:`敵の場の全モンスターに${c.n}ダメージ。`,draw:`${c.n}枚ドローする（手札上限7枚）。`,heal:`自分のライフを${c.n}回復する（最大10）。`,buff:`味方モンスター1体のATKをこのターン中${c.n}上げる。`,debuff:`敵モンスター1体のATKをこのターン中${c.n}下げる（最低0）。`,dmgDraw:'敵モンスター1体に3ダメージ、その後1枚ドロー。'})[c.ability];return ({'':'特殊能力なし。自分のレーンの前方を守りながら攻撃できる。',legacy:`破壊されたとき、自分は${c.n}枚ドローする。`,draw:`召喚したとき、自分は${c.n}枚ドローする。`,double:'自分のターンに2回まで攻撃できる。1回目で正面の敵を倒した場合、2回目は直接攻撃もできる（試作ルール）。',heal:`召喚したとき、自分のライフを${c.n}回復する。`,blast:`召喚したとき、敵のすべてのレーンのモンスターに${c.n}ダメージ。`})[c.ability]}
  function artIcon(c){return c.type==='spell'?({dmg:'🔥',aoe:'💥',draw:'📖',heal:'💚',buff:'⬆️',debuff:'🌫️',dmgDraw:'✨'})[c.ability]:({'':'⚔️',legacy:'🕯️',draw:'📖',double:'⚔️',heal:'💚',blast:'🔥'})[c.ability]}
  function abilityIcon(c){return c.type==='spell'?({dmg:'🔥',aoe:'💥',draw:'📖',heal:'💚',buff:'⬆️',debuff:'⬇️',dmgDraw:'✨'})[c.ability]:({'':'◇',legacy:'🕯',draw:'📖',double:'⚔',heal:'💚',blast:'🔥'})[c.ability]}
  const escapeHTML=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
  function cardName(id){return id==='M-01'?'森の狼':id}
  function cardHTML(c,u,who,selected=false){const isHand=!u,ability=abilityName(c),sp=c.type==='spell';const disabled=isHand&&g.player.mana<c.cost;const attackStatus=u&&who==='player'?ownAttackStatus(u):null;const cls=[isHand?'handCard':'unitCard',sp?'spell':'',who==='cpu'?'enemyCard':'',selected?'selected':'',disabled?'disabled':'',u&&!ready(who,u)?'notReady':'',u&&ready(who,u)?'ready':'',attackStatus?'own'+(attackStatus.kind==='can'?'Ready':attackStatus.kind==='sick'?'Sick':'Spent'):''].filter(Boolean).join(' ');const art=c.id==='M-01'?'<img src="assets/m01_art.webp" alt="森の狼">':artIcon(c);const stats=sp?(isHand?'<div class="cardStats" style="font-size:10px;color:#f1dbad">✦ 魔法</div>':'<div class="cardStats" style="font-size:10px;color:#f1dbad">✦ 魔法カード</div>'):`<div class="cardStats"><span class="atk">⚔${u?atk(u):c.atk}</span><span class="hp ${u&&u.hp<c.hp?'damaged':''}">♥${u?u.hp:c.hp}</span></div>`;return `<div class="${cls}" tabindex="0" role="button" aria-label="${escapeHTML(c.id+' '+ability)}。長押しで詳細"><div class="cardTop"><span class="cardId">${c.id}</span><span class="cardCost">${c.cost}</span></div><div class="cardArt">${art}</div>${attackStatus?`<div class="unitStatus ${attackStatus.kind}">${attackStatus.text}</div>`:''}<div class="cardName">${cardName(c.id)}</div><div class="cardAbility ${c.ability?'':'none'}">${abilityIcon(c)} ${escapeHTML(ability)}</div>${stats}${u&&u.attacksUsed?`<span class="attackMark">残${availableAttacks(who,u)}</span>`:''}</div>`}
  function showDetail(c,u,where){el('detailTitle').textContent=`${cardName(c.id)}｜${c.id}`;el('detailArt').innerHTML=c.id==='M-01'?'<img src="assets/m01_art.webp" alt="森の狼のイラスト">':artIcon(c);const lane=u?`<span class="pill">${LANE_NAMES[u.lane]}レーン</span>`:'';const basic=c.type==='monster'?`<span class="pill">⚔ ATK ${u?atk(u):c.atk}</span><span class="pill">♥ HP ${u?u.hp:c.hp}/${c.hp}</span>`:'<span class="pill">✦ 魔法</span>';const acts=u?`<p>攻撃：${ready(where,u)?'可能':'不可'}／残り${availableAttacks(where,u)}回</p>`:'';el('detailInfo').innerHTML=`<p><strong>${where==='hand'?'自分の手札':where==='cpu'?'CPUの場':'自分の場'}</strong></p><span class="pill">💠 コスト ${c.cost}</span>${lane}${basic}<p><strong>${escapeHTML(abilityName(c))}</strong></p><p>${escapeHTML(abilityDesc(c))}</p>${acts}${c.id==='M-01'||c.id==='M-03'?'<p style="color:#ecd8a2">※ブロッカー廃止に伴い、今は能力なしとして試験中。</p>':''}`;el('detailOverlay').classList.add('show');el('detailOverlay').setAttribute('aria-hidden','false')}
  function hideDetail(){el('detailOverlay').classList.remove('show');el('detailOverlay').setAttribute('aria-hidden','true')}
  function bindCard(node,onTap,onHold){let timer=null,start=null,held=false,moved=false;const clear=()=>{if(timer!==null){clearTimeout(timer);timer=null}};node.addEventListener('pointerdown',e=>{if(e.button!==0)return;held=false;moved=false;node.dataset.suppressClick='0';start={x:e.clientX,y:e.clientY,id:e.pointerId};clear();timer=setTimeout(()=>{timer=null;if(start&&!moved){held=true;onHold()}},520)});node.addEventListener('pointermove',e=>{if(!start||start.id!==e.pointerId)return;if(Math.hypot(e.clientX-start.x,e.clientY-start.y)>11){moved=true;clear()}});node.addEventListener('pointerup',e=>{clear();if(held){e.preventDefault();node.dataset.suppressClick='1'}start=null});node.addEventListener('pointercancel',()=>{clear();start=null});node.addEventListener('contextmenu',e=>e.preventDefault());node.addEventListener('click',e=>{if(node.dataset.suppressClick==='1'||held){e.preventDefault();node.dataset.suppressClick='0';held=false;return}if(inspect)onHold();else onTap()});node.addEventListener('keydown',e=>{if(e.key==='i'||e.key==='I'){e.preventDefault();onHold()}})}
  function makeCell(who,lane){const cell=document.createElement('div');cell.className='zoneCell';const u=unitAt(who,lane);if(u){const c=CARDS[u.id];const chosen=who==='player'&&g.selected?.kind==='attack'&&g.selected.sid===u.sid;cell.innerHTML=cardHTML(c,u,who,chosen);bindCard(cell.firstChild,()=>who==='player'?ownSlotTap(lane):enemySlotTap(lane),()=>showDetail(c,u,who))}else{let hint='空き';let special='';if(who==='player'&&g.turn==='player'&&g.selected?.kind==='summon'){hint='＋ ここに召喚';special='available'}else if(who==='cpu'&&g.turn==='player'&&g.selected?.kind==='attack'&&g.selected.lane===lane){hint='♥ 直接攻撃';special='attackHere'}else if(who==='player')hint='＋ 空き';const box=document.createElement('div');box.className=`emptySlot ${special}`;box.innerHTML=`<div class="plus">${special==='attackHere'?'♥':'＋'}</div><div>${escapeHTML(hint)}</div>`;box.setAttribute('role','button');box.tabIndex=0;box.setAttribute('aria-label',`${LANE_NAMES[lane]}レーン ${hint}`);box.addEventListener('click',()=>who==='player'?ownSlotTap(lane):enemySlotTap(lane));box.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();box.click()}});cell.append(box)}return cell}
  function updateRecord(){let r={win:0,lose:0,draw:0};try{r={...r,...JSON.parse(localStorage.getItem('bvb_3lane_record_v1')||'{}')}}catch{}el('record').textContent=`戦績：${r.win||0}勝 ${r.lose||0}敗 ${r.draw||0}分`}
  function render(){if(!g)return;el('phaseChip').textContent=g.over?'対戦終了':g.turn==='player'?'🟢 自分の番':'🟣 CPUの番';el('cpuHp').textContent=g.cpu.life;el('playerHp').textContent=g.player.life;el('cpuInfo').textContent=`山札${g.cpu.deck.length}・手札${g.cpu.hand.length}`;el('playerInfo').textContent=`山札${g.player.deck.length}・手札${g.player.hand.length}`;el('handCount').textContent=`${g.player.hand.length}/${MAX_HAND}`;el('mana').textContent=`💠 ${g.player.mana}/${g.player.maxMana}`;el('endBtn').disabled=g.turn!=='player'||g.over;el('endBtn').classList.toggle('pendingAttacks',g.turn==='player'&&!g.over&&pendingPlayerAttacks().length>0);el('cancelBtn').disabled=!g.selected;el('inspectBtn').classList.toggle('active',inspect);el('inspectBtn').setAttribute('aria-pressed',String(inspect));el('inspectBtn').textContent=inspect?'✓ 操作へ':'🔎 詳細';let message=pendingPlayerAttacks().length&&g.turn==='player'?'⚔ 攻撃可能な味方がいるよ':'手札からカードを選ぶか、味方をタップ';if(g.over)message='対戦終了！再戦で新しい試合へ';else if(inspect)message='詳細モード：カードをタップして確認';else if(g.turn==='cpu')message=g.status||'CPUが考え中…';else if(g.selected?.kind==='summon')message='召喚先の空きレーンをタップ';else if(g.selected?.kind==='attack')message=`${LANE_NAMES[g.selected.lane]}レーンの正面をタップして攻撃`;else if(g.selected?.kind==='spell')message=CARDS[g.player.hand[g.selected.index]]?.ability==='buff'?'強化する味方をタップ':'魔法を使う敵をタップ';else if(g.selected?.kind==='spellConfirm')message='内容を確認して「魔法を使用」をタップ';else if(g.selected?.kind==='handInfo')message='このカードは今は使えません';el('hint').textContent=message;
    const lanes=document.createDocumentFragment();for(let lane=0;lane<3;lane++){const track=document.createElement('div');track.className='laneTrack';const title=document.createElement('div');title.className='laneTitle';title.innerHTML=`<span class="laneNumber">${lane+1}</span>${LANE_NAMES[lane]}レーン`;track.append(title,makeCell('cpu',lane));const mid=document.createElement('div');mid.className='laneCenter';mid.innerHTML='<span>⇅</span>';track.append(mid,makeCell('player',lane));lanes.append(track)}el('lanes').replaceChildren(lanes);
    const preview=el('handPreview');
    preview.classList.toggle('confirming',g.selected?.kind==='spellConfirm');
    let previewHTML='<div class="previewText"><strong>手札を選んでね</strong><span>7枚を一度に確認。タップで選択、長押しで詳細。</span></div>';
    if(g.selected?.index!==undefined&&['summon','spell','spellConfirm','handInfo'].includes(g.selected.kind)){
       const c=CARDS[g.player.hand[g.selected.index]];
       if(c){const action=g.selected.kind==='spellConfirm'?'':'（選択中は同じカードをタップで解除）';
          previewHTML=`<div class="previewText"><strong>${escapeHTML(cardName(c.id))}｜${escapeHTML(c.id)}｜💠${c.cost} ${c.type==='monster'?`⚔${c.atk} ♥${c.hp}`:'✦魔法'}</strong><span>${escapeHTML(abilityDesc(c))}${action}</span></div>`;
          if(g.selected.kind==='spellConfirm')previewHTML+='<button type="button" class="previewAction" id="spellConfirmBtn">魔法を使用</button>';
       }
    }else if(g.selected?.kind==='attack'){
       const u=g.player.field.find(x=>x.sid===g.selected.sid),c=u&&CARDS[u.id];
       if(c)previewHTML=`<div class="previewText"><strong>${escapeHTML(cardName(c.id))}｜攻撃選択中</strong><span>${LANE_NAMES[u.lane]}レーンの正面をタップして攻撃。キャンセル可能。</span></div>`;
    }
    preview.innerHTML=previewHTML;
    el('spellConfirmBtn')?.addEventListener('click',confirmSpell);
    const hand=document.createDocumentFragment();g.player.hand.forEach((id,index)=>{const c=CARDS[id],chosen=g.selected?.index===index&&['summon','spell','spellConfirm','handInfo'].includes(g.selected.kind);const wrapper=document.createElement('div');wrapper.innerHTML=cardHTML(c,null,'hand',chosen);const card=wrapper.firstChild;bindCard(card,()=>handTap(index),()=>showDetail(c,null,'hand'));hand.append(card)});el('hand').replaceChildren(hand);updateRecord()}
  function showModal(title,content,replay=false){el('modalTitle').textContent=title;el('modalBody').innerHTML=content;el('modalReplay').style.display=replay?'inline-block':'none';el('modal').classList.add('show')}
  function hideModal(){el('modal').classList.remove('show')}
  function finish(result){g.over=true;g.result=result;pushLog(result==='win'?'あなたの勝利！':result==='lose'?'CPUの勝利！':'引き分け！');let r={win:0,lose:0,draw:0};try{r={...r,...JSON.parse(localStorage.getItem('bvb_3lane_record_v1')||'{}')}}catch{}r[result]=(r[result]||0)+1;try{localStorage.setItem('bvb_3lane_record_v1',JSON.stringify(r))}catch{}render();showModal(result==='win'?'🎉 勝利！':result==='lose'?'💫 敗北！':'🤝 引き分け',`<p>あなた：ライフ${g.player.life}／CPU：ライフ${g.cpu.life}</p><p>3本の独立したレーンで戦う、新しいルールの試作版だよ。</p>`,true)}
  function newGame(){session++;hideDetail();hideModal();hideEndConfirm();inspect=false;seq=0;g={player:side(),cpu:side(),turn:null,selected:null,over:false,result:null,status:'',logs:[]};draw('player',5);draw('cpu',5);pushLog('3レーン制の対戦開始！');startTurn(Math.random()<.5?'player':'cpu')}
  el('rulesBtn').addEventListener('click',()=>showModal('📘 3レーン試作版のルール',`<ul><li>フィールドは独立した<b>左・中央・右の3本のレーン</b>。各プレイヤーは各レーンに1体ずつ、計3体まで召喚可能。</li><li>召喚時に空いているレーンを選ぶ。<b>召喚した後は移動できない。</b></li><li>攻撃できる相手は<b>同じレーンの正面の敵1体のみ</b>。敵がいなければ、そのレーンから共通のCPU／プレイヤーライフへ直接攻撃でき、1ダメージを与える。</li><li>各プレイヤーは1人ずつ、ライフは<b>3レーン共通の10</b>。敵のライフを0にすれば勝利。</li><li>ブロッカー能力は廃止。M-01/M-03は今のところ能力なし。攻防は全モンスターが自分のレーンで担当する。</li><li>召喚したターンは攻撃不可。通常は1ターン1回、連撃は2回攻撃可能。連撃で正面の敵を倒したら、同じターンの残りの攻撃で直接攻撃できる（仮ルール）。</li><li>戦闘時はお互いのATK分のダメージを同時に与え、HPは自動回復しない。HP0以下で破壊。</li><li>魔法は自分のターンのみ使用。単体魔法はどのレーンの対象でも選べる。範囲魔法は敵の全レーンが対象。</li><li>デッキBは従来と同じ50枚。初期手札5枚、手札上限7枚。毎自ターン開始時1枚ドロー。マナは自ターンごとに1ずつ増えて最大10。</li><li>山札切れだけでは負けない。山札・手札・場がすべて空なら敗北。両者とも今後ライフを減らせるモンスターがなくなった場合は引き分け。</li><li>カードは<b>短くタップで操作、長押しで詳細</b>。手札7枚は横一列で表示し、同じカードの再タップか「キャンセル」で選択解除できる。対象を取らない魔法は「魔法を使用」で発動する。詳細モード中のタップではカードを使用しない。自分の場のカードには攻撃可・召喚酔い・攻撃済みを表示。攻撃回数が残っているときにターン終了を押すと確認する。</li></ul>`));
  el('restartBtn').addEventListener('click',()=>showModal('🔄 最初から対戦する？','<p>今の対戦を終了して、デッキをシャッフルして始めるよ。</p>',true));
  el('modalClose').addEventListener('click',hideModal);el('modalReplay').addEventListener('click',newGame);
  el('detailClose').addEventListener('click',hideDetail);el('detailOverlay').addEventListener('click',e=>{if(e.target===el('detailOverlay'))hideDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideDetail();hideModal();hideEndConfirm()}});
  el('inspectBtn').addEventListener('click',()=>{inspect=!inspect;g.selected=null;render()});el('cancelBtn').addEventListener('click',()=>{g.selected=null;render()});el('endBtn').addEventListener('click',requestEndTurn);
  el('endConfirmBack').addEventListener('click',hideEndConfirm);
  el('endConfirmGo').addEventListener('click',()=>{hideEndConfirm();if(!g.over&&g.turn==='player')endTurn()});
  el('endConfirmOverlay').addEventListener('click',e=>{if(e.target===el('endConfirmOverlay'))hideEndConfirm()});
  newGame();
  window.__LANE_TEST__={getState:()=>JSON.parse(JSON.stringify(g)),getMutableState:()=>g,cards:CARDS,deck:DECK_B,newGame,summon,cast,fight,ready,unitAt,startTurn,endTurn,cpuPlay,render,handTap,ownSlotTap,enemySlotTap};
})();
